# Jitsi Meet para las reuniones de Pulse.
#
# Cuatro servicios y ninguno de más: web (interfaz), prosody (XMPP y quién puede
# entrar), jicofo (organiza la conferencia) y jvb (mueve el vídeo).
#
# El vídeo NO pasa por nginx: el medio va por UDP 10000 directo al JVB. Meterlo por
# el proxy HTTP lo estropea — no es HTTP.

services:
  jitsi-prosody:
    image: jitsi/prosody:stable
    container_name: jitsi-prosody
    restart: unless-stopped
    expose: ["5222", "5347", "5280"]
    volumes:
      - ${CONFIG}/prosody/config:/config:Z
      - ${CONFIG}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
    environment:
      - AUTH_TYPE
      - ENABLE_AUTH
      - ENABLE_GUESTS
      - JWT_APP_ID
      - JWT_APP_SECRET
      - JWT_ACCEPTED_ISSUERS
      - JWT_ACCEPTED_AUDIENCES
      - JICOFO_AUTH_PASSWORD
      - JICOFO_COMPONENT_SECRET
      - JVB_AUTH_PASSWORD
      - JICOFO_AUTH_USER
      - JVB_AUTH_USER
      - PUBLIC_URL
      - TZ
      - XMPP_DOMAIN
      - XMPP_AUTH_DOMAIN
      - XMPP_MUC_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - TURN_CREDENTIALS
      - TURN_HOST
      - TURN_PORT
      - TURN_TRANSPORT
      - TURN_TTL
      - TURNS_HOST
      - TURNS_PORT
    networks:
      jitsi:
        aliases:
          - ${XMPP_SERVER}

  jitsi-web:
    image: jitsi/web:stable
    container_name: jitsi-web
    restart: unless-stopped
    # Solo en localhost: lo publica el nginx del host, que ya tiene el certificado.
    ports:
      - "127.0.0.1:${HTTP_PORT}:80"
    volumes:
      - ${CONFIG}/web:/config:Z
    environment:
      - ENABLE_AUTH
      - ENABLE_GUESTS
      - ENABLE_RECORDING
      - ENABLE_LIVESTREAMING
      - ENABLE_PREJOIN_PAGE
      - DISABLE_DEEP_LINKING
      - PUBLIC_URL
      - TZ
      - XMPP_DOMAIN
      - XMPP_AUTH_DOMAIN
      - XMPP_MUC_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_BOSH_URL_BASE
      - XMPP_SERVER
    depends_on: [jitsi-prosody]
    networks: [jitsi]

  jitsi-jicofo:
    image: jitsi/jicofo:stable
    container_name: jitsi-jicofo
    restart: unless-stopped
    volumes:
      - ${CONFIG}/jicofo:/config:Z
    environment:
      - AUTH_TYPE
      - ENABLE_AUTH
      - JICOFO_AUTH_USER
      - JICOFO_AUTH_PASSWORD
      - JICOFO_COMPONENT_SECRET
      - JVB_BREWERY_MUC=jvbbrewery
      - TZ
      - XMPP_DOMAIN
      - XMPP_AUTH_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_MUC_DOMAIN
      - XMPP_SERVER
    depends_on: [jitsi-prosody]
    networks: [jitsi]

  jitsi-jvb:
    image: jitsi/jvb:stable
    container_name: jitsi-jvb
    restart: unless-stopped
    # El único puerto que sí se abre al mundo: por aquí viaja el audio y el vídeo.
    ports:
      - "10000:10000/udp"
    volumes:
      - ${CONFIG}/jvb:/config:Z
    environment:
      - JVB_AUTH_USER
      - JVB_AUTH_PASSWORD
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_ADVERTISE_IPS
      - PUBLIC_URL
      - TZ
      - XMPP_AUTH_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_SERVER
    depends_on: [jitsi-prosody]
    networks: [jitsi]
    # Techo deliberado. Esta máquina también lleva Postgres y el checador de la
    # clínica: una reunión concurrida no puede dejar a nadie sin poder fichar.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 3g

  jitsi-coturn:
    image: coturn/coturn:4-alpine
    container_name: jitsi-coturn
    restart: unless-stopped
    # Red del host y no puertos publicados: TURN necesita un rango de puertos de
    # retransmision, y publicarlos uno a uno levanta un proceso docker-proxy por cada
    # puerto. Con host tambien aplica ufw, asi que sus reglas son las que mandan.
    network_mode: host
    volumes:
      - ${CONFIG}/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      # El certificado es el mismo que sirve meet.*: un TURN con certificado propio
      # obligaria a renovarlo aparte y a que un dia caduque sin que nadie mire.
      # Todo /etc/letsencrypt y en su ruta original: los ficheros de live/ son enlaces
      # relativos a ../../archive/, y montar solo live/ los deja rotos dentro.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

networks:
  jitsi:
    name: jitsi
