# TURN para las reuniones de Pulse.
#
# PARA QUE SIRVE: el JVB solo ofrece un camino, UDP 10000. Quien este en una red que
# bloquee UDP o tras un NAT simetrico no puede llegar, y hoy se quedaba fuera sin
# alternativa. TURN retransmite ese trafico por TCP/TLS, que casi ninguna red corta.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=2.25.150.106
realm=meet.mcdentalpulse.duckdns.org
server-name=meet.mcdentalpulse.duckdns.org

# Credenciales TEMPORALES firmadas con un secreto compartido, no usuarios fijos: prosody
# le entrega a cada participante un usuario que caduca. Un servidor TURN con usuario y
# contrasena fijos acaba siendo un proxy abierto en cuanto alguien mira el trafico.
use-auth-secret
static-auth-secret=__NO_SE_VERSIONA__

cert=/etc/letsencrypt/live/meet.mcdentalpulse.duckdns.org/fullchain.pem
pkey=/etc/letsencrypt/live/meet.mcdentalpulse.duckdns.org/privkey.pem
# Cifrados viejos fuera.
no-tlsv1
no-tlsv1_1

# Rango de puertos de retransmision. Acotado a proposito: una clinica no necesita miles,
# y cada puerto abierto es superficie.
min-port=49160
max-port=49200

# ── LO MAS IMPORTANTE DE ESTE FICHERO ──────────────────────────────────────
# Un TURN retransmite a donde le pidan. Sin estas lineas, cualquiera con credenciales
# podria usarlo para alcanzar la red interna de Docker (Postgres, Kong, el API) o el
# propio localhost desde fuera: exactamente el mismo agujero que se cerro en
# api/_enlace.js para los enlaces del chat, pero a nivel de red.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-multicast-peers

# Nada de escuchar como proxy generico ni de guardar credenciales en disco.
no-cli
no-software-attribute
fingerprint
