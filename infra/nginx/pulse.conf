server {
    server_name mcdentalpulse.duckdns.org;

    client_max_body_size 15m;

    # ── Cabeceras de seguridad ────────────────────────────────────────────────
    # Las mandaba vercel.json y el corte a la VPS las perdio: nginx no replica lo
    # que estaba en la configuracion de Vercel, y nadie las copio. No fallan de
    # forma visible, que es justo lo que las hace faciles de olvidar.
    #
    # La palabra "always" no es opcional: sin ella, add_header solo se aplica
    # a respuestas 2xx y 3xx, y una pagina de error saldria SIN proteccion.
    #
    # DENY y no SAMEORIGIN: Pulse no se embebe en ningun sitio, ni siquiera en si
    # mismo. Sin esta cabecera, cualquiera puede cargar Pulse en un iframe
    # invisible sobre sus propios botones — el empleado cree que pulsa una cosa y
    # pulsa otra dentro de Pulse, con su sesion abierta.
    add_header X-Frame-Options "DENY" always;

    # Impide que el navegador "adivine" el tipo de un archivo y acabe ejecutando
    # como script algo que se subio como imagen.
    add_header X-Content-Type-Options "nosniff" always;

    # Al salir hacia otro sitio (una vista previa de enlace del chat, por ejemplo)
    # no se manda la ruta completa: el otro extremo no tiene por que saber desde
    # que pantalla de Pulse se le visito.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Content-Security-Policy, de momento SOLO EN MODO INFORME ──────────────
    # Report-Only NO bloquea nada: el navegador anota en su consola lo que habria
    # bloqueado. Es la unica forma sensata de activarla en una app en produccion —
    # una CSP mal ajustada deja la pantalla en blanco sin decir por que.
    #
    # Que hay que recorrer antes de activarla de verdad: login, checador (camara y
    # onnxruntime), chat con imagen y con documento, una nota de voz, un aviso con
    # el editor, el escaner de recibos (OpenCV) y UNA REUNION.
    #
    # Decisiones que hay dentro:
    #   script-src  meet.* -> external_api.js de Jitsi se carga de ese subdominio.
    #   frame-src   meet.* -> la sala de reunion va en un iframe suyo.
    #   img-src     https: -> las tarjetas de vista previa del chat cargan imagenes
    #               de sitios arbitrarios. Afloja la politica, pero una imagen no
    #               ejecuta codigo y el rastreo ya se corta con no-referrer. Si se
    #               prefiere mas estricto, se quita y esas tarjetas salen sin foto.
    #   style-src   unsafe-inline -> React pinta estilos en linea por todas partes.
    #   worker-src  blob: -> OpenCV y el service worker.
    #   media-src   blob: -> las notas de voz antes de subirse.
    #
    # frame-ancestors 'none' hace el mismo trabajo que X-Frame-Options en los
    # navegadores modernos; la cabecera de arriba se queda para los viejos.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://meet.mcdentalpulse.duckdns.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss://mcdentalpulse.duckdns.org https://meet.mcdentalpulse.duckdns.org wss://meet.mcdentalpulse.duckdns.org; frame-src https://meet.mcdentalpulse.duckdns.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # API de Supabase self-hosted (Kong). Mismo esquema de paths que Cloud:
    # /auth/v1, /rest/v1, /storage/v1, /realtime/v1, /functions/v1.
    location ~ ^/(auth|rest|storage|realtime|functions|graphql|pg)(/|$) {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Funciones propias del proyecto (antes serverless de Vercel), wrapper Express.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend estático (SPA).
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mcdentalpulse.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mcdentalpulse.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = mcdentalpulse.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mcdentalpulse.duckdns.org;
    return 404; # managed by Certbot


}
