# Cabecera Connection correcta para proxys de WebSocket.
#
# Escribir `proxy_set_header Connection "upgrade"` a pelo manda esa cabecera SIEMPRE, también
# en las peticiones normales que caen en la misma location y que no son un upgrade. El
# resultado es un mensaje HTTP mal formado que el upstream contesta como puede — en el caso de
# Jitsi, con un 200 en vez del 101 esperado, y el cliente se queda sin señalización.
#
# Con este map la cabecera vale "upgrade" solo cuando el cliente lo pidió, y "close" si no.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
