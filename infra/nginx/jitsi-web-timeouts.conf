# Timeouts del proxy interno de jitsi-web.
#
# LA CAUSA DE QUE LAS LLAMADAS SE CORTARAN SOLAS.
#
# La señalización atraviesa DOS nginx: el del host (meet.conf) y este, dentro del
# contenedor, que reenvía a prosody. El primero ya tenía timeouts largos; este no
# define ninguno, así que usaba los 60 segundos por defecto de nginx.
#
# `proxy_send_timeout` mide el hueco entre dos ESCRITURAS hacia prosody. En una
# reunión donde alguien está escuchando, el navegador pasa medio minuto sin mandar
# nada — y nginx daba la conexión por muerta y la cerraba. En los logs se veía como
# conexiones de 26 a 57 segundos, una detrás de otra: "Client disconnected:
# connection closed" y jicofo expulsando al participante con "reason: gone".
#
# Van a nivel de server, no dentro de una location: `location = /xmpp-websocket` ya
# existe en meet.conf y repetirla aquí sería un error de configuración. Al no fijar
# ella sus propios timeouts, hereda estos.
proxy_read_timeout 900s;
proxy_send_timeout 900s;
