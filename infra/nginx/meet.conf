# Jitsi Meet para las reuniones de Pulse.
#
# Solo la señalización pasa por aquí. El audio y el vídeo van por UDP 10000 directo
# al JVB, sin tocar nginx: no son HTTP y meterlos por el proxy los estropea.
server {
    server_name meet.mcdentalpulse.duckdns.org;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La señalización XMPP viaja por WebSocket. Si esta conexión se cae, el participante
    # desaparece de la conferencia aunque el vídeo estuviera perfecto: es la llamada que
    # "se corta de repente".
    location ~ ^/(xmpp-websocket|colibri-ws)(/|$) {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # Ver /etc/nginx/conf.d/websocket-upgrade.conf. Fijarla a "upgrade" a pelo la manda
        # también en las peticiones de esta location que NO son un upgrade, y el upstream
        # responde 200 en vez de 101: el cliente se queda sin señalización.
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # LOS DOS TIMEOUTS, no solo el de lectura. proxy_send_timeout se queda en 60 s por
        # defecto y mide el hueco entre dos ESCRITURAS hacia el servidor: en una reunión donde
        # alguien solo escucha, el navegador pasa minutos sin mandar nada y nginx cierra la
        # conexión creyéndola muerta.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # Un WebSocket es un flujo, no una respuesta: con buffering nginx retiene los mensajes
        # de señalización esperando llenar un búfer y llegan a destiempo.
        proxy_buffering off;
        tcp_nodelay on;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/meet.mcdentalpulse.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/meet.mcdentalpulse.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = meet.mcdentalpulse.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name meet.mcdentalpulse.duckdns.org;
    return 404; # managed by Certbot
}
