server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index.html NO se cachea: es el unico archivo que dice que rutas tienen los assets
    # (que si llevan hash y se cachean para siempre). Sin esto el navegador puede quedarse con
    # un index viejo y seguir pidiendo el bundle anterior aunque el servidor ya tenga el nuevo:
    # se despliega, se comprueba en el servidor que el cambio esta, y al usuario no le llega.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
