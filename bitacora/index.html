<style>
  :root{
    --bg:#0a100e; --surface:#121a17; --surface-2:#18211d; --border:#233029;
    --text:#e6ece9; --muted:#8fa199; --accent:#33c98f; --accent-dim:#1f6b4c;
    --accent-soft:rgba(51,201,143,.14); --danger:#ff8080;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;}
  h1,h2,.day-weekday{font-family:'Source Serif 4',Georgia,'Times New Roman',serif;}
  .mono,.refs{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;}
  @media (prefers-reduced-motion: no-preference){
    .stat,.entry,button{transition:border-color .15s ease, background .15s ease;}
  }
  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);padding:.5em .9em;}
  button:hover{border-color:var(--accent-dim);}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  button.primary{background:var(--accent);color:#052018;border-color:var(--accent);font-weight:600;}
  button.primary:hover{background:#40dba0;}
  button.chip-x{min-width:24px;min-height:24px;display:inline-flex;align-items:center;justify-content:center;
    border:none;background:transparent;color:var(--muted);}
  button.chip-x:hover{color:var(--danger);}
  .icon{width:1em;height:1em;vertical-align:-0.15em;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .icon-sm{width:.85em;height:.85em;}
  .icon-edit{min-width:24px;min-height:24px;display:inline-flex;align-items:center;justify-content:center;
    border:none;background:transparent;color:var(--muted);opacity:.6;vertical-align:middle;}
  .icon-edit:hover,.icon-edit:focus-visible{opacity:1;color:var(--accent);}
  .wrap{max-width:760px;margin:0 auto;padding:3rem 1.5rem 5rem;}
  .banner{background:#3a2a12;color:#f2c14e;border-bottom:1px solid #5a4420;
    padding:.6em 1.5rem;font-size:.9em;text-align:center;}
  .eyebrow{margin:0 0 .6em;font-size:.78em;letter-spacing:.14em;color:var(--accent);
    text-transform:uppercase;font-weight:600;}
  h1{font-size:2.4rem;margin:0 0 .5rem;font-weight:600;text-wrap:balance;}
  .sub{color:var(--muted);max-width:60ch;margin:0 0 1.4rem;}
  .meta{display:flex;flex-wrap:wrap;gap:1.6em;font-size:.92em;color:var(--muted);
    border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:.9em 0;margin:0 0 .8em;}
  .meta b{color:var(--text);font-weight:600;margin-right:.4em;}
  .updated{color:var(--muted);font-size:.85em;margin:0 0 1.4rem;}
  .actions{display:flex;flex-wrap:wrap;gap:.6em;margin-bottom:2.6rem;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;
    background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:3rem;}
  .stat{background:var(--surface);padding:1.1em 1.2em;position:relative;}
  .stat .value{font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent);}
  .stat .label{color:var(--muted);font-size:.82em;margin-top:.2em;}
  .stat-tools{position:absolute;top:.2em;right:.2em;display:flex;gap:2px;}
  .add-stat{background:var(--surface);border:1px dashed var(--border);color:var(--muted);
    display:flex;align-items:center;justify-content:center;}
  .timeline{position:relative;padding-left:1.6rem;border-left:2px solid var(--border);}
  .day{position:relative;margin-bottom:2.4rem;}
  .day::before{content:'';position:absolute;left:-1.72rem;top:.35rem;width:10px;height:10px;
    border-radius:50%;background:var(--bg);border:2px solid var(--accent);}
  .day-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:.7em;margin-bottom:.9em;}
  .day-weekday{font-style:italic;font-size:1.3rem;font-weight:600;}
  .day-rest{color:var(--muted);}
  .day-tools{margin-left:auto;display:flex;align-items:center;gap:.3em;}
  .day-tag{font-size:.72em;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid var(--accent-dim);color:var(--accent);border-radius:999px;padding:.25em .8em;
    background:var(--accent-soft);}
  button.day-tag:hover{border-color:var(--accent);}
  .empty-note{color:var(--muted);font-style:italic;font-size:.92em;padding:.4em 0;}
  .entry{background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:1em 1.1em;margin-bottom:.8em;break-inside:avoid;}
  .entry-head{display:flex;align-items:flex-start;gap:.6em;margin-bottom:.4em;}
  .entry-title{font-weight:600;flex:1;}
  .cat{font-size:.68em;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;
    padding:.22em .55em;white-space:nowrap;font-weight:600;}
  .entry-desc{color:#c7d3ce;font-size:.94em;margin:0 0 .3em;}
  .refs{color:var(--muted);font-size:.78em;word-break:break-word;}
  .entry-tools{display:flex;gap:.4em;margin-left:auto;}
  .pendings{margin-top:3rem;border-top:1px solid var(--border);padding-top:1.6rem;}
  .pendings > p{color:var(--muted);font-size:.92em;margin-top:-.4em;}
  .pendings ul{list-style:none;margin:1em 0;padding:0;display:flex;flex-direction:column;gap:.6em;}
  .pendings li{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;}
  .arrow{color:var(--accent);display:inline-flex;}
  .ptext{flex:1;min-width:12em;}
  .owner{font-size:.72em;color:var(--muted);border:1px solid var(--border);border-radius:999px;
    padding:.15em .7em;}
  .empty-note.pendings-empty{padding:0 0 .4em;}
  footer{margin-top:3.5rem;padding-top:1.2rem;border-top:1px solid var(--border);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5em;color:var(--muted);font-size:.78em;}
  dialog{background:var(--surface);color:var(--text);border:1px solid var(--border);
    border-radius:12px;padding:1.6em;max-width:480px;width:90vw;}
  dialog::backdrop{background:rgba(0,0,0,.55);}
  dialog h2{margin-top:0;font-size:1.2rem;font-style:italic;}
  dialog label{display:block;font-size:.82em;color:var(--muted);margin:.9em 0 .3em;}
  dialog input,dialog select,dialog textarea{width:100%;background:var(--surface-2);
    border:1px solid var(--border);color:var(--text);border-radius:6px;padding:.5em .6em;font:inherit;}
  dialog textarea{min-height:5em;resize:vertical;}
  dialog .dialog-actions{display:flex;justify-content:flex-end;gap:.6em;margin-top:1.4em;}

  @media print{
    body{background:#fff;color:#111;}
    .banner,.no-print{display:none !important;}
    .wrap{max-width:100%;padding:0;}
    .eyebrow,.day-weekday,.day-tag,.stat .value{color:#111 !important;}
    .icon-edit,.stat-tools{display:none !important;}
    .stats{background:#ccc;border-color:#ccc;}
    .stat,.entry,.owner{background:#fff;border-color:#ccc;}
    .day-tag{background:#f2f2f2;border-color:#ccc;}
    .entry-desc{color:#333;}
    .timeline{border-left-color:#ccc;}
    .day::before{border-color:#111;background:#fff;}
    .meta,.sub,.updated,footer{color:#444 !important;}
    .entry{page-break-inside:avoid;}
  }
</style>
</head>

<div id="banner" class="banner no-print" hidden></div>
<div class="wrap"><div id="app"></div></div>

<dialog id="entryDialog">
  <h2 id="entryDialogTitle">Agregar entrada</h2>
  <form id="entryForm">
    <input type="hidden" id="f-id">
    <label for="f-date">Fecha</label>
    <input type="date" id="f-date" required>
    <label for="f-cat">Categoría</label>
    <select id="f-cat"></select>
    <label for="f-title">Título</label>
    <input type="text" id="f-title" required placeholder="Qué se hizo, en pocas palabras">
    <label for="f-desc">Descripción</label>
    <textarea id="f-desc" required placeholder="El detalle: qué pasaba, qué se cambió, por qué"></textarea>
    <label for="f-refs">Referencias (opcional)</label>
    <input type="text" id="f-refs" placeholder="migración 127 · archivo.js · función()">
    <div class="dialog-actions">
      <button type="button" data-action="close-dialog">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="rangeDialog">
  <h2>Editar rango de fechas</h2>
  <form id="rangeForm">
    <label for="r-start">Fecha de inicio</label>
    <input type="date" id="r-start" required>
    <label for="r-end">Fecha de fin</label>
    <input type="date" id="r-end" required>
    <div class="dialog-actions">
      <button type="button" data-action="close-dialog">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="entornoDialog">
  <h2>Editar entorno</h2>
  <form id="entornoForm">
    <label for="ent-value">Entorno</label>
    <input type="text" id="ent-value" required placeholder="pulse-db (VPS, producción)">
    <div class="dialog-actions">
      <button type="button" data-action="close-dialog">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="textDialog">
  <h2 id="textDialogTitle">Editar</h2>
  <form id="textDialogForm">
    <div id="tf-wrap-1"><label id="tf-label-1" for="tf-1"></label><input id="tf-1"></div>
    <div id="tf-wrap-2"><label id="tf-label-2" for="tf-2"></label><input id="tf-2"></div>
    <div id="tf-wrap-3"><label id="tf-label-3" for="tf-3"></label><input id="tf-3"></div>
    <div class="dialog-actions">
      <button type="button" data-action="close-dialog">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

{
  "title": "Semana del 31 de agosto",

  "stats": [],
  "dayTags": {},
  "entries": [
    {"id":"e1","date":"2026-08-31","category":"VERIFICACION","title":"Chequeo general de bugs en Pulse","desc":"Pasada completa: 573 tests (vitest) en verde, build de producción limpio, y revisión de los planes/hallazgos abiertos en el repo. No apareció ningún bug funcional nuevo — solo ruido de lint preexistente.","refs":""},
    {"id":"e2","date":"2026-08-31","category":"CORRECCION","title":"Limpieza de imports \"React\" sin usar","desc":"63 archivos traían import React sin usar (config de JSX transform vieja, no rompía nada pero ensuciaba el lint). Quitado el import mecánicamente en los 63 — de 93 errores de eslint a 26, sin tocar los que sí necesitan cambio de lógica.","refs":""},
    {"id":"e3","date":"2026-08-31","category":"OTRO","title":"Bitácora reiniciada para la semana nueva","desc":"Cerrada la semana del inventario (24-28 ago) y arrancada esta con el mismo patrón de \"Nueva semana\": stats/etiquetas/entradas en blanco, pendientes y entorno igual que antes.","refs":""},
    {"id":"e4","date":"2026-08-31","category":"FEATURE","title":"Rol Admin+ por encima de admin","desc":"A pedido del dueño: un nivel arriba de admin que ve/toca todo lo que admin (heredado automático vía current_role(), sin tocar política por política) y es el ÚNICO que puede crear, borrar, resetear contraseña o renombrar una cuenta admin o admin_plus — cierra de paso un hueco real que quedó abierto desde julio (RH/psicóloga podían hacerlo sobre cuentas admin sin restricción; el fix del pentest que lo cerraba solo se había aplicado en la VPS, nunca volvió al repo). Primer Admin+ (\"Sistemas\") se reclama con un ticket atómico de un solo uso, restringido a quien ya es admin de verdad — sin carrera, sin que RH/psicóloga puedan colarse. Sumado: panel Módulos, para prender/apagar Comisiones/Checador/Notas/Departamentos/Avisos/Encuestas por persona (los 6 interruptores que ya existían — bodega, inventario, etc. — se unieron ahí mismo). Checador tiene el bloqueo dentro de la función que registra la checada, no solo en la vista — es el módulo marcado como más delicado (afecta asistencia/nómina real).","refs":"migraciones 138-146 · admin-create-usuario · admin-delete-usuario · admin-reset-password · admin-update-username · ModulosPanel.jsx"},
    {"id":"e5","date":"2026-08-31","category":"VERIFICACION","title":"Admin+: 5 rondas de revisión adversarial hasta limpio","desc":"Por ser cambio de autorización se corrió con dos líneas de revisión independientes (correctness + seguridad), cada una con checkers frescos, no el mismo que hizo el cambio. Primera ronda encontró 3 huecos reales (arranque del primer Admin+ sin restricción de identidad ni bloqueo de carrera; los 6 módulos nuevos editables por RH/psicóloga con un PATCH directo, saltándose el panel; 4 rutas SQL que comprobaban el rol directo de la tabla y por eso no reconocían a Admin+). Corregidos, y en las rondas siguientes salieron más del mismo tipo: 4 pantallas y 3 notificaciones que tampoco reconocían el rol nuevo, y el más grave — la puerta de entrada de las 4 funciones de administración de cuentas excluía a Admin+ por completo, dejándolo sin poder crear, borrar, resetear ni renombrar a nadie. Las 5 rondas terminaron en APPROVE limpio en las dos líneas. 573/573 tests, build limpio en cada iteración.","refs":"migración 145 · migración 146"},
    {"id":"e6","date":"2026-08-31","category":"HALLAZGO","title":"admin-create-usuario y admin-delete-usuario en la VPS ya no eran los del repo","desc":"Antes de subir Admin+ se comparó (md5sum) cada archivo contra lo que la VPS de verdad sirve — mismo hábito que ya había atrapado divergencias en agosto. Salieron dos: el pentest del 7 de agosto (commit d950e76) sí se había desplegado a admin-create-usuario (solo admin crea admin) y admin-delete-usuario (solo admin borra definitivo, ni siquiera RH) directo en la VPS, pero nunca volvió a este repo — igual que el trigger de la base, que también ya tenía ese parche puesto (confirmado leyendo la función en vivo). El diseño de Admin+ ya cubría el primer caso (lo generaliza: ahora ni un admin normal crea otro admin, solo Admin+); el segundo sí se había perdido en mi versión local vieja — corregido antes de tocar producción, para no aflojar una restricción que el dueño ya había pedido.","refs":"admin-create-usuario · admin-delete-usuario"},
    {"id":"e7","date":"2026-08-31","category":"VERIFICACION","title":"Admin+ desplegado en producción","desc":"9 migraciones (138-146) aplicadas contra pulse-db real, una por una — 145 se detuvo a medio camino porque 4 de las funciones de inventario las creó originalmente supabase_admin, no postgres (\"must be owner\"); resuelto conectando como supabase_admin (superusuario) para esas dos migraciones, sin tocar nada más. Enum con admin_plus, ticket de arranque sin usar, 6 columnas de módulo en true, todo confirmado leyendo la base real. Las 4 edge functions se copiaron al volumen real que sirve el contenedor (no basta con el checkout del repo en /opt/pulse/app — son dos copias separadas) y se reinició pulse-edge-functions. Frontend reconstruido con build-frontend.sh: 20/20 comprobaciones visuales en verde, bundle nuevo confirmado con \"admin_plus\" adentro, sitio público respondiendo 200.","refs":"migraciones 138-146 · build-frontend.sh · pulse-edge-functions"},
    {"id":"e8","date":"2026-09-01","category":"FEATURE","title":"Cuenta \"Sistemas\" (primer Admin+) creada en producción","desc":"A pedido del dueño: cuenta nueva por API directo contra la VPS (login \"sistemas\", sin correo real — usa el dominio interno sintético de siempre), contraseña temporal forzada a cambiar en el primer login. Consumió el ticket de arranque de un solo uso: de acá en adelante ya no hay forma de fabricar un \"primer\" Admin+ por ningún camino, solo Admin+ crea a otro Admin+.","refs":"reclamar_bootstrap_admin_plus · auth.admin.createUser"},
    {"id":"e9","date":"2026-09-01","category":"FEATURE","title":"Barra de Admin+: navegar por rol + interruptor global por módulo","desc":"A pedido del dueño: la barra de Admin+ se reemplazó por 6 desplegables — Usuario/Doctor/RH/Psicóloga/Admin (cada uno con TODO el menú de ese rol y un interruptor que lo prende/apaga para todos los de ese rol a la vez, no persona por persona) más \"Módulos\" con las pantallas propias de Admin+. El interruptor nuevo se suma (AND) al que ya existía por persona — decisión del dueño — pero solo pega de verdad en los 7 ítems que ya tenían candado real (Comisiones/Checador/Notas/Departamentos/Avisos/Encuestas); los otros ~118 ítems del menú (Vacaciones, Horarios, Config, Gestión de Personal...) solo se esconden del menú al apagarlos, documentado así a propósito en vez de fingir un candado que no existe — auditar cada uno es un proyecto aparte, a pedir. Encontrado y corregido antes de desplegar: \"Mi Encuesta\" (empleado/doctor) y \"Encuestas\" (gestión) son dos claves distintas para la misma tabla — sin el caso especial, apagar una no habría afectado a la otra.","refs":"migraciones 147-148 · AdminPlusNav.jsx · modulosRolService.js"},
    {"id":"e10","date":"2026-09-01","category":"VERIFICACION","title":"Interruptor por rol desplegado en producción","desc":"Mismo hábito de comparar (md5sum) contra lo que la VPS de verdad tiene antes de escribir — esta vez sin sorpresas, todo coincidía con lo esperado. 2 migraciones aplicadas como supabase_admin (evita el mismo problema de dueño de función que salió con Admin+). 10 archivos de frontend copiados y verificados byte a byte. build-frontend.sh: 20/20 comprobaciones visuales en verde, bundle confirmado con \"modulosRol\" adentro, sitio público respondiendo 200. Revisión adversarial (grado L, un checker fresco): APPROVE sin hallazgos.","refs":"migraciones 147-148 · build-frontend.sh"},
    {"id":"e11","date":"2026-09-01","category":"HALLAZGO","title":"Bug propio: modulos_rol salió sin GRANT de tabla, tumbó avisos/encuestas/comisiones","desc":"A los minutos de desplegar el interruptor por rol, el dueño reportó 403 en módulos, avisos, encuestas y comisiones — las cuatro a la vez. Causa: la tabla modulos_rol se creó con RLS pero sin el GRANT de tabla que Postgres exige aparte (RLS sola no alcanza) — y como las políticas de avisos/encuestas/comisiones ahora consultan modulos_rol por dentro (mig. 148), el error de permisos se les contagió a las tres, no solo al panel nuevo. Migración 149 (el GRANT que faltaba) aplicada de inmediato, confirmado con has_table_privilege() y una consulta real simulando el rol authenticated.","refs":"migración 149 · has_table_privilege()"},
    {"id":"e12","date":"2026-09-01","category":"FEATURE","title":"Módulos por persona: cualquier ítem del menú, no solo los 6 de siempre","desc":"A pedido del dueño: además del interruptor global por rol, Admin+ puede prender/apagar CUALQUIER ítem del menú (los ~125, mismo alcance que el de rol) para una persona en particular. Pantalla \"Módulos\" rediseñada: de tabla de 12 columnas a buscar persona → ver su lista completa con un interruptor cada uno. Los 6 ítems de siempre (comisiones/checador/notas/departamentos/avisos/encuestas) siguen con su columna dedicada tal cual; los demás van a una tabla nueva (modulos_persona) — con su GRANT en el mismo archivo esta vez, lección de e11 aplicada. 2 rondas de revisión: la primera encontró que \"Ubicación de mi clínica\" (puedeUbicarSucursal) se había quedado sin mapear en usuariosService.js — el interruptor se veía apagado siempre y guardar no hacía nada, sin avisar error — y que Admin+ podía apagarse a sí mismo la pantalla \"Módulos\" y quedar sin forma de volver a entrar. Los dos corregidos (incluido un candado en la propia base, no solo en el cliente, contra el auto-bloqueo) antes de la segunda ronda, que dio APPROVE.","refs":"migración 150 · ModulosPanel.jsx · modulosPersonaService.js"},
    {"id":"e13","date":"2026-09-01","category":"VERIFICACION","title":"Módulos por persona desplegado en producción","desc":"Mismo hábito de comparar contra la VPS real antes de escribir — sin sorpresas. has_table_privilege() confirmado en true para select/insert antes de seguir (justo lo que faltó chequear la vez pasada). 5 archivos de frontend copiados y verificados byte a byte. build-frontend.sh: 20/20 en verde, bundle confirmado con \"modulosPersona\" adentro, sitio respondiendo 200.","refs":"migración 150 · build-frontend.sh"},
    {"id":"e14","date":"2026-09-01","category":"CORRECCION","title":"Bug: \"Módulos\" llevaba a /admin_plus/modulos, que no existe","desc":"El dueño lo reportó con pantallazo: \"Vista en construcción / No encontrada\". Causa: el buscador global (reusado dentro de la barra de Admin+) armaba la ruta con el rol tal cual (`/${user.role}/...`), y Admin+ no tiene rutas propias — solo /admin/*. El mismo patrón estaba repetido en 6 archivos más (BotonMensajes, BotonReuniones, Sidebar ×3, y 2 más encontrados después por la revisión). Arreglado con un solo helper (rutaBaseDe) en vez de parchar cada sitio suelto — los 2 que la revisión encontró aparte (FichaEmpleado, ChecadorEmpleado) hoy son inalcanzables para Admin+, pero se corrigieron igual para no dejar la misma trampa a medio armar.","refs":"navItems.js (rutaBaseDe) · BuscadorGlobal.jsx"},
    {"id":"e15","date":"2026-09-01","category":"UI","title":"Desplegables de Admin+: por categoría y con scroll","desc":"A pedido del dueño: los desplegables por rol (hasta 32 ítems, ej. RH o Psicóloga) se veían cortados por abajo, sin forma de ver el resto. Se agrupan ahora por categoría (mismo agruparPorCampo que ya usa el menú normal) y el desplegable tiene tope de alto con scroll propio — sin tocar el .topnav-menu de siempre, para no arriesgar los desplegables de los otros 4 roles que ya estaban probados.","refs":"AdminPlusNav.jsx · App.css (.topnav-menu--rol)"},
    {"id":"e16","date":"2026-09-01","category":"CORRECCION","title":"La causa real del /admin_plus/modulos: el guardián de rutas no la corregía","desc":"El dueño lo reportó otra vez, con el mismo pantallazo, después del fix de e14 — la URL vieja se quedaba pegada en el navegador. Causa de fondo: App.jsx tiene un guardián que corrige la URL si no coincide con la del rol (\"si no estás en tu carpeta, te mando a tu carpeta\"), pero comparaba con startsWith a secas — y \"/admin_plus/modulos\".startsWith(\"/admin\") da true en JavaScript, son letras, no carpetas. El guardián nunca corregía una URL vieja de /admin_plus/..., así que quedaba viendo el catch-all (\"Vista en construcción\") para siempre, sin importar cuántas veces se recargara. Arreglado exigiendo el límite de carpeta exacto (== o termina en \"/\"), no solo que las letras coincidan.","refs":"App.jsx (guardián de rutas)"},
    {"id":"e17","date":"2026-09-01","category":"UI","title":"Interruptores de Módulos: se veían mal hechos","desc":"El dueño lo reportó: los botones de encender/apagar se veían rotos. Causa: el interruptor (.cuenta-switch) nació como adorno visual de un <span> dentro de otro botón — al reusarlo como botón de verdad en la barra de Admin+ y en Módulos, el navegador le metía su borde y relleno por defecto encima, sin que nada se lo quitara. Reseteado solo para esa variante, sin tocar el interruptor de modo oscuro que ya andaba bien. De paso, la lista de personas de Módulos no tenía ni relleno ni separación entre filas — se amontonaba — corregido también.","refs":"App.css (.cuenta-switch, .emp-list-simple)"},
    {"id":"e18","date":"2026-09-01","category":"UI","title":"Módulos: filtro por sucursal (el ajuste de espacio se deshizo)","desc":"A pedido del dueño: la búsqueda de persona en Módulos tiene un desplegable de sucursal al lado del nombre, mismo componente que Gestión de Personal — este quedó bien. El acortado de espacio entre la barra y la lista se pasó de corto (\"quedó muy metido\", reportado con pantallazo) y se deshizo, vuelve al espaciado normal de siempre — sin acceso a internet en esta sesión para ajustarlo a ojo, mejor dejarlo como ya se veía bien que arriesgar otra vuelta a ciegas.","refs":"ModulosPanel.jsx · Select.jsx"},
    {"id":"e19","date":"2026-09-01","category":"HALLAZGO","title":"Admin+ no podía usar vacaciones, permisos, reuniones, IA ni aprobar rostros — otra capa que nunca se tocó","desc":"Investigando aparte una pregunta del dueño (intercambio de festivos) apareció esto: api/ (las funciones Node/Vercel, capa separada de src/ y de las Edge Functions de Supabase, nunca tocada en toda esta ronda de Admin+) tenía 9 archivos con listas de roles fijas tipo [\"admin\",\"rh\",\"psicologa\"] sin admin_plus — bloqueaba resolver vacaciones/permisos/comisiones/intercambios, convocar reuniones, usar el asistente de IA, aprobar/enrolar rostros, mandar mensajes a gestión y recibir los avisos de todo el equipo. Corregidos los 9. Dos rondas de revisión independiente encontraron, cada una, una instancia más del mismo patrón que la ronda anterior no había visto (limpiar-adjuntos.js primero, enviar-mensaje.js después) — corregidas ambas antes de la tercera ronda, que dio APPROVE limpio. 573/573 tests en cada vuelta.","refs":"api/enviar-mensaje.js · api/crear-reunion.js · api/gemini.js · api/resolver.js · api/aprobar-rostro.js · api/enrolar-rostro.js · api/_notificaciones.js · api/_push.js · api/tareas-programadas.js · api/limpiar-adjuntos.js"},
    {"id":"e20","date":"2026-09-01","category":"VERIFICACION","title":"Fix de api/ desplegado — y otra divergencia real encontrada al comparar","desc":"Antes de copiar, comparación md5sum de los 10 archivos contra lo que sirve pulse-api-server: 9 coincidían, pero api/tareas-programadas.js en la VPS traía ~120 líneas que nunca llegaron al repo (encuesta por período quincenal real en vez de semana a secas, aviso crítico cuando la geocerca da \"lejos\" — no solo \"muda\" —, y una función nueva que avisa a gestión de personas que se quedaron sin poder fichar). Se le sumó la línea de admin_plus ENCIMA de lo que la VPS ya tenía, sin pisar nada de eso. build-api.sh reconstruyó pulse-api-server, health check en verde, hash de los 3 archivos con historia distinta confirmado byte a byte contra el contenedor real. Pendiente para el dueño: decidir si esas ~120 líneas de tareas-programadas.js se traen al repo (hoy solo viven en la VPS).","refs":"build-api.sh · pulse-api-server"},
    {"id":"e21","date":"2026-09-01","category":"FEATURE","title":"Intercambio de festivos: Oficina Administrativa sin límite de día","desc":"A pedido del dueño. Al probar la migración salió que la VPS YA tenía, aplicado a mano y sin ningún commit, un rediseño completo de la exclusividad: en vez de un solo dueño por fecha_destino en toda la empresa (como decía el repo), la exclusividad ya era por SUCURSAL — sucursales distintas pueden compartir día, solo choca dentro de la misma sucursal — con 52 solicitudes activas usándolo. Confirmado con el dueño: se deja ese esquema tal cual (no se toca nada de lo que ya funciona) y se agrega que Oficina Administrativa queda TOTALMENTE sin límite, ni siquiera entre personas de esa misma sucursal. La migración 151 documenta primero lo que la VPS ya tenía (para que el repo deje de estar desincronizado) y encima agrega la excepción, sobre el índice único y la función que el calendario usa para marcar días ya ocupados.","refs":"migración 151 · CalendarioIntercambio.jsx"},
    {"id":"e22","date":"2026-09-01","category":"VERIFICACION","title":"Oficina Administrativa desplegado y probado con datos reales","desc":"Migración probada en transacción con rollback (como supabase_admin, la función del trigger es de ese dueño) antes de aplicarla en serio. Con inserts reales dentro de una transacción sin confirmar: dos personas de Oficina Administrativa pidiendo el mismo día — pasa sin choque; dos personas de la MISMA otra sucursal (McDental Leon) pidiendo el mismo día — sigue chocando (23505) como siempre. Nada de esto se confirmó en la base real, solo se probó y se deshizo. Revisión adversarial en curso al momento de este cierre.","refs":"migración 151"},
    {"id":"e23","date":"2026-09-02","category":"HALLAZGO","title":"Migración 151: la excepción de Oficina Administrativa no cubría los alias legacy","desc":"Retomada la revisión adversarial que quedó a medias. Checker independiente montó Postgres real (no mock, pglite/WASM) y reprodujo el hueco: el índice y la función comparaban la sucursal contra el string exacto 'Oficina Administrativa', pero constants.js documenta desde siempre que 'Oficina Central' y 'Central' son el mismo puesto con nombre legacy (SUCURSAL_ALIASES, usado en 7+ pantallas) — un empleado con esa etiqueta vieja en su sucursal seguía chocando (23505), justo lo que la migración decía resolver para todos. Corregido: la comparación ahora excluye los tres nombres, con comentario apuntando a SUCURSAL_ALIASES para que no se desincronicen si se agrega un alias nuevo. De paso, un comentario suelto en solicitar-intercambio.js seguía citando la migración 075 en vez de la 151 (cosmético, corregido también).","refs":"migración 151 (líneas del índice y de intercambios_destinos_ocupados) · api/solicitar-intercambio.js · src/utils/constants.js (SUCURSAL_ALIASES)"},
    {"id":"e24","date":"2026-09-02","category":"VERIFICACION","title":"Migración 151 cerrada: 2 rondas de revisión adversarial, APPROVE limpio","desc":"Con Postgres real (no mock): instalación fresca, re-ejecución idempotente, y los 5 casos que la propia migración documenta como \"debe pasar\" — todos correctos. Segunda ronda (checker fresco, no el mismo que corrigió) reprodujo además el caso puntual del hallazgo (dos personas con 'Oficina Central' ya no chocan) sin romper el caso normal (misma sucursal no-administrativa sigue chocando). Sin hallazgos nuevos. 573/573 tests y build de producción limpio, corridos aparte y dentro de cada revisión.","refs":"migración 151"},
    {"id":"e25","date":"2026-09-02","category":"VERIFICACION","title":"Migración 151 desplegada en pulse-db real","desc":"Aplicada contra la VPS en producción (un salto, llave dedicada). Primer intento como postgres falló (\"must be owner of function intercambios_sellar_sucursal\" — la función ya existía en la VPS creada por otro rol, mismo patrón de dueño de función que ya había salido con Admin+); reconectado como supabase_admin, corrió limpio. Verificado contra datos reales: has_function_privilege() en true para authenticated, el índice único quedó con los 3 nombres (Oficina Administrativa/Oficina Central/Central) en su definición, y hay 7 filas reales con sucursal='Oficina Administrativa' ya en la tabla.","refs":"migración 151 · pulse-db"},
    {"id":"e26","date":"2026-09-02","category":"HALLAZGO","title":"\"McDental Madero Boulevard\": sucursal 26 real, ausente del array estático de constants.js","desc":"Al revisar los datos reales de la 151 salió una sucursal que no está en las 25 de SUCURSALES (constants.js): resultó ser legítima, no un typo — existe en la tabla sucursales (activa, con geocerca) con 3 empleados reales asignados. No estaba rota para nadie: los 12 dropdowns de la app usan nombresSucursales (lee de la base en vivo, vía GlobalContext), no el array estático. Ese array solo es el fallback si el fetch a la base falla — se quedó desactualizado y ahí sí faltaba. Agregada al array para que el fallback no mienta.","refs":"src/utils/constants.js (SUCURSALES)"},
    {"id":"e27","date":"2026-09-02","category":"VERIFICACION","title":"Fix de constants.js desplegado en producción","desc":"Antes de copiar: md5sum del archivo en /opt/pulse/app contra lo committeado en HEAD — coincidían byte a byte, sin divergencia previa (a diferencia de otras veces esta semana). Copiado el archivo, verificado md5sum contra el local. build-frontend (Dockerfile.frontend con el ANON_KEY real) y redeploy del contenedor. Bundle nuevo confirmado con el string \"McDental Madero Boulevard\" adentro, sitio público respondiendo 200.","refs":"Dockerfile.frontend · pulse-frontend"},
    {"id":"e28","date":"2026-09-02","category":"FEATURE","title":"Elegir el festivo tocándolo en el calendario, no solo desde el desplegable","desc":"A pedido del dueño: en Intercambiar un día, el festivo resaltado en el calendario ahora se puede elegir tocándolo — un botón \"Elegir este festivo para intercambiar\" aparece en el panel del día cuando el festivo tocado es de los que sí se pueden intercambiar (mismo filtro de dos meses que ya tenía el desplegable, para no ofrecer uno que el servidor iba a rechazar). El desplegable original se queda igual, es un atajo más, no un reemplazo. Cambio de frontend puro (CalendarioMensual.jsx ganó dos props opcionales, sin efecto en RH ni otros usos del calendario reutilizable).","refs":"CalendarioMensual.jsx · CalendarioIntercambio.jsx"},
    {"id":"e29","date":"2026-09-02","category":"VERIFICACION","title":"Atajo de festivo en el calendario desplegado","desc":"md5sum de los 3 archivos contra la VPS antes de copiar: los dos .jsx coincidían con HEAD, App.css divergía de HEAD pero el diff real contra el archivo que sirve la VPS fue de una sola línea (la nueva) — la VPS ya iba adelante del último commit local, no al revés. Copiados y verificados byte a byte. build-frontend + redeploy, bundle confirmado con el string del botón nuevo adentro, sitio respondiendo 200.","refs":"Dockerfile.frontend · pulse-frontend"},
    {"id":"e30","date":"2026-09-02","category":"OTRO","title":"139 archivos sin commitear, separados en 8 commits por tema","desc":"A pedido del dueño: toda la semana (Admin+, módulos por rol y por persona, api/ con admin_plus, intercambios, atajo de festivo, fix de sucursales) quedó commiteada en 8 commits temáticos en vez de uno solo — mismo estilo que ya usa el repo. Limpieza mecánica de imports React aparte, para no mezclar ruido con cambios reales. 25 capturas de pantalla de verificación visual (sueltas en la raíz, nunca versionadas) se borraron a pedido — eran artefactos de esta semana, no código.","refs":"13bc83f..9a9269c"},
    {"id":"e31","date":"2026-09-02","category":"HALLAZGO","title":"origin/vps-docker tenía una rama viva desde el 4-5 de agosto, nunca traída a este checkout","desc":"Al hacer git push salió que origin (MCDentalPulseBackUp) tenía 10 commits en vps-docker que este repo local nunca recibió — se quedaron ahí desde el 5 de agosto sin que nadie los mergeara de vuelta. La mayoría ya estaban reimplementados de forma independiente en esta línea (mismo bug de \"la psicóloga escribía al primero de la lista\" ya corregido con otro nombre de variable, EmpleadosList/FichaEmpleado ya separadas, limpiarNotificaciones ya existía). Lo que sí faltaba de verdad: api/solicitar-intercambio.js tenía TODA su validación (festivo real, no conmemorativo, ventana de un mes) solo en la pantalla — un POST a mano se saltaba todas las reglas, y esa rama vieja ya lo había cerrado en el servidor. También apareció la migración 113: es la migración real de la exclusividad por sucursal que esta semana se documentó en la 151 como \"aplicado a mano, sin migración\" — sí existía, en una rama que nunca se trajo. Migración 114 (permiso para vaciar notificaciones): el botón y el código cliente ya existían, el permiso en la base nunca se había creado — bug real en producción, recién descubierto.","refs":"origin/vps-docker (692618a..8d4f546) · tag local respaldo-antes-merge-vps-docker-20260902"},
    {"id":"e32","date":"2026-09-02","category":"VERIFICACION","title":"Merge completo, sin aplicar nada nuevo a producción todavía","desc":"4 conflictos reales (Mensajes.jsx, EmpleadosList.jsx, FichaEmpleado.jsx, navItems.js, api/solicitar-intercambio.js) resueltos a mano, uno por uno — no con -X ours/theirs a ciegas. Descartada a propósito una línea huérfana (enSala/SalaJitsi, botón de llamada directa desde Mensajes) que en la rama vieja estaba completa pero acá llegaba sin el estado que la sostiene — no se reintrodujo a medias. CSS duplicado de .detail-list-item--accion (versión vieja sin tema oscuro) removido a favor de la de esta semana. 573/573 tests, build limpio. Push a origin y prod (rama vieja nueva ahí, main sin tocar). PENDIENTE: la validación de servidor de api/solicitar-intercambio.js y la migración 114 (permiso de limpiar notificaciones) todavía NO están en pulse-db real — solo en el repo. Falta desplegarlas.","refs":"commit bfb226a · origin/vps-docker · prod/vps-docker (rama nueva)"}

<script>
(function(){
  var STORAGE_KEY = 'mcdental-bitacora-pulse-v1';

  var CATS = [
    ['BACKEND','Backend','#8b9dff'],
    ['UI','UI','#d19bff'],
    ['DATOS','Datos','#f2c14e'],
    ['CORRECCION','Corrección','#ff8080'],
    ['FEATURE','Feature','#3ddc9b'],
    ['HALLAZGO','Hallazgo','#5cc8f2'],
    ['VERIFICACION','Verificación','#3fe0c5'],
    ['OTRO','Otro','#9fb0a9']
  ];
  function catMeta(key){
    for(var i=0;i<CATS.length;i++){ if(CATS[i][0]===key) return {label:CATS[i][1],color:CATS[i][2]}; }
    return {label:'Otro',color:'#9fb0a9'};
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return JSON.parse(document.getElementById('seed').textContent);
  }
  var STATE = loadState();

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function editBtn(action,id,label){
    return '<button class="icon-edit no-print" data-action="'+action+'"'+(id?' data-id="'+id+'"':'')+
      ' aria-label="'+esc(label)+'"><svg class="icon icon-sm"><use href="#icon-pencil"/></svg></button>';
  }
  function delBtn(action,id,label){
    return '<button class="chip-x no-print" data-action="'+action+'" data-id="'+id+'" aria-label="'+esc(label)+'">'+
      '<svg class="icon icon-sm"><use href="#icon-x"/></svg></button>';
  }
  function pad(n){ return String(n).padStart(2,'0'); }
  function todayISO(){
    var d=new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function dateRange(startISO,endISO){
    var out=[], d=new Date(startISO+'T00:00:00'), end=new Date(endISO+'T00:00:00');
    while(d<=end){
      out.push(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));
      d.setDate(d.getDate()+1);
    }
    return out;
  }
  function formatRange(startISO,endISO){
    var s=new Date(startISO+'T00:00:00'), e=new Date(endISO+'T00:00:00');
    var wd=function(d){return new Intl.DateTimeFormat('es-MX',{weekday:'short'}).format(d).replace('.','');};
    var my=function(d){return new Intl.DateTimeFormat('es-MX',{month:'short',year:'numeric'}).format(d).replace('.','');};
    return wd(s)+' '+s.getDate()+' — '+wd(e)+' '+e.getDate()+' '+my(e);
  }
  function formatDayHeader(iso){
    var d=new Date(iso+'T00:00:00');
    var weekday=new Intl.DateTimeFormat('es-MX',{weekday:'long'}).format(d);
    var month=new Intl.DateTimeFormat('es-MX',{month:'long'}).format(d);
    return {weekday: weekday.charAt(0).toUpperCase()+weekday.slice(1), rest: d.getDate()+' de '+month};
  }
  function autoUpdated(){
    var d=new Date();
    var wd=new Intl.DateTimeFormat('es-MX',{weekday:'short'}).format(d).replace('.','');
    var mon=new Intl.DateTimeFormat('es-MX',{month:'short'}).format(d).replace('.','');
    return wd+' '+d.getDate()+' '+mon+', '+pad(d.getHours())+':'+pad(d.getMinutes());
  }

  function entryTpl(e){
    var cm = catMeta(e.category);
    return '<div class="entry">'+
      '<div class="entry-head">'+
        '<span class="entry-title">'+esc(e.title)+'</span>'+
        '<span class="cat" style="color:'+cm.color+';background:'+cm.color+'22">'+esc(cm.label)+'</span>'+
        '<span class="entry-tools no-print">'+
          editBtn('edit-entry',e.id,'Editar entrada: '+e.title)+
          delBtn('del-entry',e.id,'Eliminar entrada: '+e.title)+
        '</span>'+
      '</div>'+
      '<p class="entry-desc">'+esc(e.desc)+'</p>'+
      (e.refs ? '<div class="refs">'+esc(e.refs)+'</div>' : '')+
    '</div>';
  }

  function dayTpl(iso){
    var h = formatDayHeader(iso);
    var isToday = iso===todayISO();
    var entries = STATE.entries.filter(function(e){return e.date===iso;});
    var tag = STATE.dayTags[iso];
    var tagHtml = '<span class="day-tools">'+
      (tag
        ? '<span class="day-tag">'+esc(tag)+'</span>'+editBtn('edit-daytag',iso,'Editar etiqueta del día')
        : '<button class="day-tag no-print" data-action="edit-daytag" data-id="'+iso+'" style="opacity:.5">+ etiqueta</button>')+
    '</span>';
    var body;
    if(entries.length){
      body = entries.map(entryTpl).join('');
    } else if(iso===STATE.weekEnd){
      body = '<p class="empty-note">Día de entrega del reporte semanal — se cierra esta bitácora aquí.</p>';
    } else {
      body = '<p class="empty-note">Todavía no hay trabajo registrado — se actualiza al final del día.</p>';
    }
    return '<div class="day">'+
      '<div class="day-head">'+
        '<span class="day-weekday">'+esc(h.weekday)+'</span>'+
        '<span class="day-rest">'+esc(h.rest)+(isToday?' · hoy':'')+'</span>'+
        tagHtml+
      '</div>'+
      body+
    '</div>';
  }

  function statTpl(s){
    return '<div class="stat">'+
      '<div class="value">'+esc(s.value)+'</div><div class="label">'+esc(s.label)+'</div>'+
      '<span class="stat-tools no-print">'+
        editBtn('edit-stat',s.id,'Editar métrica: '+s.label)+
        delBtn('del-stat',s.id,'Quitar métrica: '+s.label)+
      '</span>'+
    '</div>';
  }

  function pendingTpl(p){
    return '<li><span class="arrow"><svg class="icon icon-sm"><use href="#icon-arrow-right"/></svg></span>'+
      '<span class="ptext">'+esc(p.text)+'</span>'+
      '<span class="owner">'+esc(p.owner)+'</span>'+
      editBtn('edit-pending',p.id,'Editar pendiente: '+p.text)+
      delBtn('del-pending',p.id,'Quitar pendiente: '+p.text)+
    '</li>';
  }

  function buildBody(){
    var days = dateRange(STATE.weekStart, STATE.weekEnd).map(dayTpl).join('');
    var stats = STATE.stats.map(statTpl).join('') +
      '<button class="add-stat no-print" data-action="add-stat">+ métrica</button>';
    var pendings = STATE.pendings.length ? STATE.pendings.map(pendingTpl).join('')
      : '<li class="empty-note pendings-empty">Sin pendientes por ahora.</li>';
    return (
      '<p class="eyebrow">McDental Pulse · Bitácora de trabajo</p>'+
      '<h1>'+esc(STATE.title)+editBtn('edit-title',null,'Editar título')+'</h1>'+
      '<p class="sub">'+esc(STATE.subtitle)+editBtn('edit-subtitle',null,'Editar subtítulo')+'</p>'+
      '<div class="meta">'+
        '<span><b>Rango</b>'+esc(formatRange(STATE.weekStart,STATE.weekEnd))+editBtn('edit-range',null,'Editar rango de fechas')+'</span>'+
        '<span><b>Entorno</b>'+esc(STATE.entorno)+editBtn('edit-entorno',null,'Editar entorno')+'</span>'+
      '</div>'+
      '<p class="updated">Última actualización '+esc(STATE.lastUpdate)+'</p>'+
      '<div class="actions no-print">'+
        '<button data-action="print"><svg class="icon"><use href="#icon-printer"/></svg> Descargar / imprimir PDF</button>'+
        '<button class="primary" data-action="add-entry">+ Agregar entrada</button>'+
        '<button data-action="new-week"><svg class="icon"><use href="#icon-refresh"/></svg> Nueva semana</button>'+
      '</div>'+
      '<div class="stats">'+stats+'</div>'+
      '<div class="timeline">'+days+'</div>'+
      '<div class="pendings">'+
        '<h2>Lo que sigue, para que no se pierda</h2>'+
        '<p>No es trabajo pendiente de esta semana — son decisiones que le tocan al dueño.</p>'+
        '<ul>'+pendings+'</ul>'+
        '<button class="no-print" data-action="add-pending">+ pendiente</button>'+
      '</div>'+
      '<footer><span>McDental Pulse — bitácora interna, no compartir fuera del equipo</span><span>mcdentalpulse.duckdns.org</span></footer>'
    );
  }

  function showBanner(msg){
    var b=document.getElementById('banner');
    b.textContent=msg; b.hidden=false;
  }

  function render(){
    document.getElementById('app').innerHTML = buildBody();
  }

  function persist(){
    STATE.lastUpdate = autoUpdated();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
    catch(e){ showBanner('No se pudo guardar en este navegador: '+e.message); }
    render();
  }

  // ---- entry dialog ----
  var dialog = document.getElementById('entryDialog');
  var form = document.getElementById('entryForm');
  var catSelect = document.getElementById('f-cat');
  catSelect.innerHTML = CATS.map(function(c){return '<option value="'+c[0]+'">'+c[1]+'</option>';}).join('');

  function clampDate(iso){
    if(iso<STATE.weekStart) return STATE.weekStart;
    if(iso>STATE.weekEnd) return STATE.weekEnd;
    return iso;
  }
  function openEntryDialog(entry){
    document.getElementById('entryDialogTitle').textContent = entry ? 'Editar entrada' : 'Agregar entrada';
    document.getElementById('f-id').value = entry ? entry.id : '';
    document.getElementById('f-date').value = entry ? entry.date : clampDate(todayISO());
    catSelect.value = entry ? entry.category : 'BACKEND';
    document.getElementById('f-title').value = entry ? entry.title : '';
    document.getElementById('f-desc').value = entry ? entry.desc : '';
    document.getElementById('f-refs').value = entry ? (entry.refs||'') : '';
    dialog.showModal();
  }
  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var id = document.getElementById('f-id').value;
    var data = {
      date: document.getElementById('f-date').value,
      category: catSelect.value,
      title: document.getElementById('f-title').value.trim(),
      desc: document.getElementById('f-desc').value.trim(),
      refs: document.getElementById('f-refs').value.trim()
    };
    if(!data.title || !data.desc || !data.date) return;
    if(id){
      var e = STATE.entries.find(function(x){return x.id===id;});
      if(e) Object.assign(e, data);
    } else {
      data.id = uid();
      STATE.entries.push(data);
    }
    dialog.close();
    persist();
  });
  dialog.addEventListener('click', function(ev){ if(ev.target===dialog) dialog.close(); });

  // ---- range dialog ----
  var rangeDialog = document.getElementById('rangeDialog');
  document.getElementById('rangeForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    var s = document.getElementById('r-start').value;
    var e = document.getElementById('r-end').value;
    if(!s || !e || s>e){ alert('Fechas inválidas: el inicio debe ser antes que el fin.'); return; }
    STATE.weekStart = s; STATE.weekEnd = e;
    rangeDialog.close();
    persist();
  });
  rangeDialog.addEventListener('click', function(ev){ if(ev.target===rangeDialog) rangeDialog.close(); });

  // ---- entorno dialog ----
  var entornoDialog = document.getElementById('entornoDialog');
  document.getElementById('entornoForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    var v = document.getElementById('ent-value').value.trim();
    if(!v) return;
    STATE.entorno = v;
    entornoDialog.close();
    persist();
  });
  entornoDialog.addEventListener('click', function(ev){ if(ev.target===entornoDialog) entornoDialog.close(); });

  // ---- generic text dialog (título, subtítulo, etiqueta, métricas, pendientes, nueva semana) ----
  var textDialog = document.getElementById('textDialog');
  var textDialogTitle = document.getElementById('textDialogTitle');
  var TEXT_FIELDS = [1,2,3].map(function(n){
    return {
      wrap: document.getElementById('tf-wrap-'+n),
      label: document.getElementById('tf-label-'+n),
      input: document.getElementById('tf-'+n)
    };
  });
  var textDialogOnSave = null;
  function openTextDialog(title, fields, onSave){
    textDialogTitle.textContent = title;
    TEXT_FIELDS.forEach(function(slot, i){
      var f = fields[i];
      if(f){
        slot.wrap.hidden = false;
        slot.label.textContent = f.label;
        slot.input.type = f.type || 'text';
        slot.input.value = f.value || '';
        slot.input.placeholder = f.placeholder || '';
        slot.input.required = f.required !== false;
      } else {
        slot.wrap.hidden = true;
        slot.input.required = false;
      }
    });
    textDialogOnSave = onSave;
    textDialog.showModal();
  }
  document.getElementById('textDialogForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    var values = TEXT_FIELDS.map(function(slot){ return slot.input.value.trim(); });
    if(textDialogOnSave) textDialogOnSave(values);
  });
  textDialog.addEventListener('click', function(ev){ if(ev.target===textDialog) textDialog.close(); });

  // ---- delegated actions ----
  document.addEventListener('click', function(ev){
    var el = ev.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action, id = el.dataset.id;
    switch(action){
      case 'print': window.print(); break;
      case 'close-dialog': {
        var openDialog = document.querySelector('dialog[open]');
        if(openDialog) openDialog.close();
        break;
      }
      case 'add-entry': openEntryDialog(null); break;
      case 'edit-entry': openEntryDialog(STATE.entries.find(function(x){return x.id===id;})); break;
      case 'del-entry':
        if(confirm('¿Eliminar esta entrada?')){
          STATE.entries = STATE.entries.filter(function(x){return x.id!==id;});
          persist();
        }
        break;
      case 'edit-title': {
        openTextDialog('Editar título', [{label:'Título', value:STATE.title}], function(v){
          if(!v[0]) return;
          STATE.title = v[0]; textDialog.close(); persist();
        });
        break;
      }
      case 'edit-subtitle': {
        openTextDialog('Editar subtítulo', [{label:'Subtítulo', value:STATE.subtitle, required:false}], function(v){
          STATE.subtitle = v[0]; textDialog.close(); persist();
        });
        break;
      }
      case 'edit-range': {
        document.getElementById('r-start').value = STATE.weekStart;
        document.getElementById('r-end').value = STATE.weekEnd;
        rangeDialog.showModal();
        break;
      }
      case 'edit-entorno': {
        document.getElementById('ent-value').value = STATE.entorno;
        entornoDialog.showModal();
        break;
      }
      case 'edit-daytag': {
        openTextDialog('Etiqueta del día', [{label:'Etiqueta (vacío para quitarla)', value:STATE.dayTags[id]||'', required:false}], function(v){
          if(v[0]) STATE.dayTags[id]=v[0]; else delete STATE.dayTags[id];
          textDialog.close(); persist();
        });
        break;
      }
      case 'add-stat': {
        openTextDialog('Agregar métrica', [
          {label:'Valor (ej. 4, 33/33)', value:''},
          {label:'Etiqueta (ej. bugs corregidos)', value:''}
        ], function(v){
          if(!v[0]||!v[1]) return;
          STATE.stats.push({id:uid(), value:v[0], label:v[1]});
          textDialog.close(); persist();
        });
        break;
      }
      case 'edit-stat': {
        var s2 = STATE.stats.find(function(x){return x.id===id;}); if(!s2) break;
        openTextDialog('Editar métrica', [
          {label:'Valor', value:s2.value},
          {label:'Etiqueta', value:s2.label}
        ], function(v){
          if(!v[0]||!v[1]) return;
          s2.value=v[0]; s2.label=v[1]; textDialog.close(); persist();
        });
        break;
      }
      case 'del-stat':
        STATE.stats = STATE.stats.filter(function(x){return x.id!==id;});
        persist();
        break;
      case 'add-pending': {
        openTextDialog('Agregar pendiente', [
          {label:'Pendiente', value:''},
          {label:'¿De quién depende?', value:'dueño'}
        ], function(v){
          if(!v[0]) return;
          STATE.pendings.push({id:uid(), text:v[0], owner:v[1]||'dueño'});
          textDialog.close(); persist();
        });
        break;
      }
      case 'edit-pending': {
        var p = STATE.pendings.find(function(x){return x.id===id;}); if(!p) break;
        openTextDialog('Editar pendiente', [
          {label:'Pendiente', value:p.text},
          {label:'¿De quién depende?', value:p.owner}
        ], function(v){
          if(!v[0]) return;
          p.text=v[0]; p.owner=v[1]||p.owner; textDialog.close(); persist();
        });
        break;
      }
      case 'del-pending':
        STATE.pendings = STATE.pendings.filter(function(x){return x.id!==id;});
        persist();
        break;
      case 'new-week': {
        if(!confirm('¿Empezar una semana nueva? Exportá el PDF de esta semana antes si no lo hiciste.')) break;
        openTextDialog('Nueva semana', [
          {label:'Fecha de inicio', type:'date', value:STATE.weekEnd},
          {label:'Fecha de fin', type:'date', value:STATE.weekEnd},
          {label:'Título', value:STATE.title}
        ], function(v){
          if(!v[0] || !v[1] || v[0]>v[1] || !v[2]){ alert('Revisá las fechas y el título.'); return; }
          STATE = {
            title: v[2], subtitle: STATE.subtitle, weekStart: v[0], weekEnd: v[1],
            entorno: STATE.entorno, lastUpdate: '', stats: [], dayTags: {},
            entries: [], pendings: STATE.pendings
          };
          textDialog.close(); persist();
        });
        break;
      }
    }
  });

  render();
})();
</script>
</body>
</html>
