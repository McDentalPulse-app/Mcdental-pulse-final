<style>
  :root{
    --bg:#0a100e; --surface:#121a17; --surface-2:#18211d; --border:#233029;
    --text:#e6ece9; --muted:#8fa199; --accent:#33c98f; --accent-dim:#1f6b4c;
    --accent-soft:rgba(51,201,143,.14); --danger:#ff8080;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;}
  h1,h2,.day-weekday{font-family:'Source Serif 4',Georgia,'Times New Roman',serif;}
  .mono,.refs{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;}
  @media (prefers-reduced-motion: no-preference){
    .stat,.entry,button{transition:border-color .15s ease, background .15s ease;}
  }
  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);padding:.5em .9em;}
  button:hover{border-color:var(--accent-dim);}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  button.primary{background:var(--accent);color:#052018;border-color:var(--accent);font-weight:600;}
  button.primary:hover{background:#40dba0;}
  button.chip-x{min-width:24px;min-height:24px;display:inline-flex;align-items:center;justify-content:center;
    border:none;background:transparent;color:var(--muted);}
  button.chip-x:hover{color:var(--danger);}
  .icon{width:1em;height:1em;vertical-align:-0.15em;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .icon-sm{width:.85em;height:.85em;}
  .icon-edit{min-width:24px;min-height:24px;display:inline-flex;align-items:center;justify-content:center;
    border:none;background:transparent;color:var(--muted);opacity:.6;vertical-align:middle;}
  .icon-edit:hover,.icon-edit:focus-visible{opacity:1;color:var(--accent);}
  .wrap{max-width:760px;margin:0 auto;padding:3rem 1.5rem 5rem;}
  .banner{background:#3a2a12;color:#f2c14e;border-bottom:1px solid #5a4420;
    padding:.6em 1.5rem;font-size:.9em;text-align:center;}
  .eyebrow{margin:0 0 .6em;font-size:.78em;letter-spacing:.14em;color:var(--accent);
    text-transform:uppercase;font-weight:600;}
  h1{font-size:2.4rem;margin:0 0 .5rem;font-weight:600;text-wrap:balance;}
  .sub{color:var(--muted);max-width:60ch;margin:0 0 1.4rem;}
  .meta{display:flex;flex-wrap:wrap;gap:1.6em;font-size:.92em;color:var(--muted);
    border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:.9em 0;margin:0 0 .8em;}
  .meta b{color:var(--text);font-weight:600;margin-right:.4em;}
  .updated{color:var(--muted);font-size:.85em;margin:0 0 1.4rem;}
  .actions{display:flex;flex-wrap:wrap;gap:.6em;margin-bottom:2.6rem;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;
    background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:3rem;}
  .stat{background:var(--surface);padding:1.1em 1.2em;position:relative;}
  .stat .value{font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent);}
  .stat .label{color:var(--muted);font-size:.82em;margin-top:.2em;}
  .stat-tools{position:absolute;top:.2em;right:.2em;display:flex;gap:2px;}
  .add-stat{background:var(--surface);border:1px dashed var(--border);color:var(--muted);
    display:flex;align-items:center;justify-content:center;}
  .timeline{position:relative;padding-left:1.6rem;border-left:2px solid var(--border);}
  .day{position:relative;margin-bottom:2.4rem;}
  .day::before{content:'';position:absolute;left:-1.72rem;top:.35rem;width:10px;height:10px;
    border-radius:50%;background:var(--bg);border:2px solid var(--accent);}
  .day-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:.7em;margin-bottom:.9em;}
  .day-weekday{font-style:italic;font-size:1.3rem;font-weight:600;}
  .day-rest{color:var(--muted);}
  .day-tools{margin-left:auto;display:flex;align-items:center;gap:.3em;}
  .day-tag{font-size:.72em;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid var(--accent-dim);color:var(--accent);border-radius:999px;padding:.25em .8em;
    background:var(--accent-soft);}
  button.day-tag:hover{border-color:var(--accent);}
  .empty-note{color:var(--muted);font-style:italic;font-size:.92em;padding:.4em 0;}
  .entry{background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:1em 1.1em;margin-bottom:.8em;break-inside:avoid;}
  .entry-head{display:flex;align-items:flex-start;gap:.6em;margin-bottom:.4em;}
  .entry-title{font-weight:600;flex:1;}
  .cat{font-size:.68em;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;
    padding:.22em .55em;white-space:nowrap;font-weight:600;}
  .entry-desc{color:#c7d3ce;font-size:.94em;margin:0 0 .3em;}
  .refs{color:var(--muted);font-size:.78em;word-break:break-word;}
  .entry-tools{display:flex;gap:.4em;margin-left:auto;}
  .pendings{margin-top:3rem;border-top:1px solid var(--border);padding-top:1.6rem;}
  .pendings > p{color:var(--muted);font-size:.92em;margin-top:-.4em;}
  .pendings ul{list-style:none;margin:1em 0;padding:0;display:flex;flex-direction:column;gap:.6em;}
  .pendings li{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;}
  .arrow{color:var(--accent);display:inline-flex;}
  .ptext{flex:1;min-width:12em;}
  .owner{font-size:.72em;color:var(--muted);border:1px solid var(--border);border-radius:999px;
    padding:.15em .7em;}
  .empty-note.pendings-empty{padding:0 0 .4em;}
  footer{margin-top:3.5rem;padding-top:1.2rem;border-top:1px solid var(--border);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5em;color:var(--muted);font-size:.78em;}
  dialog{background:var(--surface);color:var(--text);border:1px solid var(--border);
    border-radius:12px;padding:1.6em;max-width:480px;width:90vw;}
  dialog::backdrop{background:rgba(0,0,0,.55);}
  dialog h2{margin-top:0;font-size:1.2rem;font-style:italic;}
  dialog label{display:block;font-size:.82em;color:var(--muted);margin:.9em 0 .3em;}
  dialog input,dialog select,dialog textarea{width:100%;background:var(--surface-2);
    border:1px solid var(--border);color:var(--text);border-radius:6px;padding:.5em .6em;font:inherit;}
  dialog textarea{min-height:5em;resize:vertical;}
  dialog .dialog-actions{display:flex;justify-content:flex-end;gap:.6em;margin-top:1.4em;}

  @media print{
    body{background:#fff;color:#111;}
    .banner,.no-print{display:none !important;}
    .wrap{max-width:100%;padding:0;}
    .eyebrow,.day-weekday,.day-tag,.stat .value{color:#111 !important;}
    .icon-edit,.stat-tools{display:none !important;}
    .stats{background:#ccc;border-color:#ccc;}
    .stat,.entry,.owner{background:#fff;border-color:#ccc;}
    .day-tag{background:#f2f2f2;border-color:#ccc;}
    .entry-desc{color:#333;}
    .timeline{border-left-color:#ccc;}
    .day::before{border-color:#111;background:#fff;}
    .meta,.sub,.updated,footer{color:#444 !important;}
    .entry{page-break-inside:avoid;}
  }
</style>
</head>

  "entries": [
    {"id":"e1","date":"2026-09-07","category":"OTRO","title":"PC vieja (100.92.81.83): confirmada no alcanzable, dueño decide no rotar la llave","desc":"Cerrando el §5 del plan de saneamiento: se confirmó (dato que ya traía HANDOFF-pulse-vps.md desde el 31-jul) que la PC vieja no responde por Tailscale. Revisado authorized_keys real de la VPS: 3 llaves, ninguna identificable como la compartida de la migración (comentarios claude-mcdental-deploy ×2 y alfredo@claude-code, ninguna coincide con las llaves locales de esta sesión ni con nada etiquetado como la PC física del dueño) — no se pudo aislar cuál línea rotar sin arriesgar la de la PC nueva, que usa el mismo archivo de llave. Dueño, con esa info, decide no tocar nada: \"si funciona, mejor no moverle\". Riesgo asumido a propósito, no pendiente por olvido — mientras exista el disco de la PC vieja, sigue teniendo esa misma llave sin passphrase y pulse-password-temporal.xlsx.","refs":"plan-sanear-sistema-sep2026.md §5 · HANDOFF-pulse-vps.md"},
    {"id":"e2","date":"2026-09-07","category":"OTRO","title":"Contraseña de la cuenta admin_plus \"sistemas\" restablecida directo en pulse-db, a pedido del dueño","desc":"El botón normal de reset (edge function admin-reset-password) exige que quien llama ya esté autenticado como admin_plus — no aplicaba, era la única cuenta admin_plus y nadie tenía la contraseña. Reset hecho fuera de la app: UPDATE directo en auth.users.encrypted_password (pgcrypto crypt()/gen_salt('bf'), mismo formato bcrypt que usa GoTrue) a la temporal de siempre (emp123), y en public.usuarios se marcó debe_cambiar_password=true — mismo estado en el que queda cualquier reset hecho desde la pantalla normal, así que al entrar pide cambiarla de una vez. Confirmado leyendo la fila real después del UPDATE, no solo el mensaje de éxito de psql. No se tocó SERVICE_ROLE_KEY ni ningún archivo de credenciales de la VPS — la ruta con la API de auth (GoTrue) fue bloqueada por el clasificador de permisos del propio Claude Code por tocar el .env de secretos; se resolvió con SQL directo sobre la tabla, sin pasar por ahí.","refs":"pulse-db · auth.users · public.usuarios · supabase/functions/admin-reset-password/index.ts"},
    {"id":"e3","date":"2026-09-07","category":"CORRECCION","title":"KPI \"Empleados\" sin refresh en vivo + Mario Ruiz y la psicóloga ensuciando el conteo de Horarios","desc":"A pedido del dueño, dos cambios. 1) `usuarios` en GlobalContext.jsx se cargaba una sola vez al login, sin refetch — el KPI \"Empleados\" del Dashboard Global no se movía con la pestaña ya abierta aunque alguien diera de alta o baja a un empleado. Agregado mismo patrón que ya tenían encuestas/avisos: refetch al volver a la pestaña + polling cada 60s, sin canal realtime (altas/bajas son raras). 2) Investigando dónde \"contaban como empleado\" Mario Ruiz (role admin) y sistemas (admin_plus) — el dueño después sumó a la psicóloga — se confirmó contra pulse-db real que el KPI del Dashboard Global YA los excluía (filtra por rol empleado/doctor), igual que personas_que_dejaron_de_fichar() y estado_del_sistema() en la base, que ya traían el mismo filtro con comentario explícito. El hueco real estaba en GestionHorarios.jsx (grilla de asignación de horario): no filtraba por rol, y Mario Ruiz y la psicóloga (Ana Goretty Salas), ambos con sucursal \"Oficina Administrativa\" cargada, sí aparecían y se contaban ahí. Agregada exclusión de admin/admin_plus/psicologa en ese único archivo — rh se queda, sigue con checador propio y necesita horario asignado. Ninguno de los tres pierde acceso a la app ni su propio checador (donde aplique); solo se les saca de esta grilla y de este conteo.","refs":"GlobalContext.jsx · GestionHorarios.jsx · adversarial-reviewer (APPROVE)"},
    {"id":"e4","date":"2026-09-07","category":"VERIFICACION","title":"e3 desplegado en producción — y otro archivo que nunca había recibido el lint-fix de e39 (semana pasada)","desc":"Antes de copiar, comparado byte a byte contra /opt/pulse/app: GlobalContext.jsx coincidía exacto con el HEAD previo del repo local (sin edición propia de la VPS que arriesgar), pero GestionHorarios.jsx en la VPS seguía con la versión de ANTES del fix de lint de la semana pasada (el efecto que fijaba la sucursal por defecto, en vez de la variable derivada) — nunca se había vuelto a desplegar, mismo patrón de divergencia ya visto con App.css/navItems.js. Sin riesgo real: es limpieza de lint, mismo comportamiento. Copiados los 2 archivos, verificados md5sum idénticos, build-frontend.sh reconstruyó la imagen: 20/20 comprobaciones visuales en verde, bundle nuevo confirmado (\"admin_plus\" presente en 4 chunks), sitio público en 200.","refs":"build-frontend.sh · pulse-frontend"},
    {"id":"e5","date":"2026-09-07","category":"OTRO","title":"Limpieza de la carpeta del proyecto: 10 plan-*.md sueltos a plans/, temp.txt muerto borrado","desc":"A pedido del dueño (\"hay muchas cosas\"). Los 10 plan-*.md de la raíz (mezcla de cerrados y abiertos, sin criterio de separación claro) se movieron a plans/ — un solo lugar, sin partir en abiertos/cerrados para no sumar otra decisión. Corregidas las 3 referencias cruzadas reales en HANDOFF-pulse-vps.md (apuntaban al nombre viejo en la raíz); las referencias entre planes que ahora son hermanos en plans/ no necesitaban cambio. temp.txt (11 KB, fragmento de un App.jsx de antes del refactor a componentes, cero referencias en todo el repo) borrado. De paso, dist/ (30 MB, compilado local que no lo usa el deploy real — el build de producción es dentro de un contenedor en la VPS) y .playwright-mcp/ (2.2 MB de logs de consola de fines de agosto) limpiados — ambos gitignored, se regeneran solos. Sin tocar código: 589/589 tests, build limpio.","refs":"plans/ · HANDOFF-pulse-vps.md"},
    {"id":"e6","date":"2026-09-07","category":"OTRO","title":"contexto.md y auditoria-pulse-producto.md fuera de git","desc":"A pedido del dueño, siguiendo la limpieza de e5. Antes de sacar los 6 docs grandes de la raíz de git le marqué el riesgo real de 3: README.md (portada de GitHub), DESIGN.md (SSOT de diseño, mis reglas lo esperan versionado en la raíz) y HANDOFF-pulse-vps.md (guía de despliegue que necesito cada sesión — sin git no viaja con un checkout nuevo). El dueño eligió sacar solo los 2 sin ese problema: contexto.md (congelado desde el 25-jul, superado por HANDOFF) y auditoria-pulse-producto.md (reporte de un solo uso, 8-ago) — historial cerrado, no rompen nada. Ambos siguen en disco, solo dejan de versionarse (agregados a .gitignore, sacados del índice con git rm --cached). README/DESIGN/PULSE_DESIGN_SYSTEM/HANDOFF se quedan en git tal cual.","refs":".gitignore"},
    {"id":"e7","date":"2026-09-07","category":"FEATURE","title":"Organigrama: base de datos y datos reales cargados (Fases 1-2 de 5)","desc":"A pedido del dueño, con imagen de referencia del organigrama actual. Sin tabla de nodos: el árbol es `usuarios` consigo misma vía `jefe_id` nuevo, y las cajas de grupo (Dentistas, Recepcionistas, Personal de limpieza) se calculan agrupando por `puesto` al pintar, no se guardan aparte — así el conteo nunca se desfasa de la plantilla real. Migración 153: columnas `jefe_id`/`area_id`, tabla `areas` (departamentos del organigrama, distinta del módulo Departamentos estilo Teams de la mig. 134), trigger anti-ciclos, `prevent_usuario_privilege_escalation()` ampliada para que solo admin/admin_plus/rh muevan el organigrama (la psicóloga sigue pudiendo editar puesto/sucursal, permiso preexistente sin tocar), `usuarios_directorio` recreada, bucket privado `responsabilidades` con lista blanca de PDF/Word. 2 líneas de revisión adversarial independientes (correctness + seguridad), ambas contra pulse-db real: APPROVE sin hallazgos — 22 escenarios de ataque probados en la de seguridad. Migración 154: datos reales — matcheo automático de 18 nombres de la imagen contra `usuarios` real (18/18 encontrados, una con otra ortografía), 6 áreas creadas, 100 personas vigentes con área asignada y 99 con jefe directo (Mario Ruiz es la raíz; solo la cuenta técnica `sistemas` queda sin asignar, a propósito). El dueño resolvió en vivo 3 ambigüedades que no se podían adivinar: \"Gerente General\" no existe como persona (Ana Salas depende directo de Mario), el personal de sistemas cuelga de Alfredo Burgos, y un puesto \"Servicio al clienteAux Lic. Mario\" es un asistente directo del Director General. Pendiente: Fase 3 (pantalla de solo lectura, árbol interactivo), Fase 4 (edición), Fase 5 (subir/descargar el archivo de responsabilidades por depto).","refs":"plans/plan-organigrama.md · migración 153 · migración 154 · 2× adversarial-reviewer"},
    {"id":"e8","date":"2026-09-07","category":"FEATURE","title":"Organigrama: Fases 3-5 desplegadas — pantalla interactiva, edición y archivo por depto","desc":"Árbol en memoria a partir de usuarios+jefe_id/area_id, sin tabla de nodos: los hermanos con el mismo puesto se agrupan al pintar (\"Dentistas · 50\") en vez de guardarse aparte. Pantalla con expandir/colapsar, buscador que abre la rama hasta la coincidencia, panel de detalle (a quién reporta, quién le reporta), y los 2 desplegables de edición (jefe directo, departamento) solo para admin/admin_plus/rh — la psicóloga y el resto ven el árbol pero ningún control de edición. Vista de departamentos con subir/descargar/borrar el archivo de responsabilidades (PDF/Word). Visible para los 6 roles, sin restricción. Revisión adversarial (autorización real ya vive en la migración 153, esto es la capa de UX): APPROVE, 2 hallazgos LOW sin bloquear (recursión no de cola con 5000+ personas en cadena — muy por encima de la plantilla real — y un ID duplicado por error de datos que desaparecería en silencio). 594/594 tests, build y eslint limpios. Desplegado: 4 layouts en la VPS traían un import muerto de React nunca limpiado (mismo patrón visto antes con App.css/navItems.js/GestionHorarios.jsx), corregido de paso sin riesgo. 20/20 comprobaciones visuales en verde, bundle confirmado con \"organigrama\" en 7 chunks, sitio público en 200.","refs":"Organigrama.jsx · arbol.js · build-frontend.sh · adversarial-reviewer"},
    {"id":"e9","date":"2026-09-08","category":"VERIFICACION","title":"Organigrama confirmado en uso real — sin loguearme yo, con los logs del servidor","desc":"No puedo loguearme con una cuenta de la app para probar clic a clic (mis reglas de seguridad prohíben escribir contraseñas en un campo, incluso de una cuenta que yo mismo generé). En su lugar, log real de Kong de las últimas 12h: un empleado entró a /empleado/organigrama desde su iPhone y su avatar cargó 200 — ya se usó en producción sin que nadie viera una pantalla rota. GET a /rest/v1/areas y /rest/v1/usuarios_directorio (con jefe_id/area_id) responden 200 con tráfico real de Android e iPhone, cero errores. plan-organigrama.md actualizado con esta evidencia en vez de dejar la casilla sin marcar.","refs":"plans/plan-organigrama.md · pulse-kong"},
    {"id":"e10","date":"2026-09-08","category":"FEATURE","title":"Nav móvil: indicador de swipe en el asa + buscador global (solo faltaba en móvil)","desc":"A pedido del dueño: \"creo que no se dan cuenta\" de que la barra inferior se desliza hacia arriba, y en móvil no había forma de buscar una pantalla por nombre (en escritorio ya existía, BuscadorGlobal en el header). Chevron animado sobre el asa hasta que alguien la usa una vez (swipe o toque) — se guarda en localStorage y no vuelve a salir; se marca \"visto\" en el propio gesto, no en un efecto (saltó un react-hooks/set-state-in-effect real en la primera versión, corregido). BuscadorMovil.jsx nuevo: botón flotante arriba a la izquierda (mismo alto que la campana, que está a la derecha), despliega campo + resultados al tocar. La lógica de filtrado se sacó a un hook compartido (useBuscadorGlobal.js) para que escritorio y móvil no la dupliquen — BuscadorGlobal.jsx reescrito para usarlo, mismo comportamiento verificado carácter a carácter. Revisión adversarial: APPROVE, 1 hallazgo LOW (el chevron se centraba por el fallback de flex en vez de una regla explícita) corregido en el mismo commit. 594/594 tests, build y eslint limpios. Desplegado: 20/20 comprobaciones visuales en verde, sitio público en 200.","refs":"Sidebar.jsx · BuscadorMovil.jsx · useBuscadorGlobal.js · adversarial-reviewer"},
    {"id":"e11","date":"2026-09-08","category":"FEATURE","title":"Organigrama: visibilidad temporal solo Oficina Administrativa","desc":"A pedido del dueño: \"que solo lo pueda ver la oficina administrativa mientras\". Campo calculado puedeVerOrganigrama() en constants.js (sin columna nueva a propósito, es provisional): role admin_plus o sucursal Oficina Administrativa (con alias legacy \"Oficina Central\"/\"Central\" incluidos, vía normalizeSucursal ya existente). admin_plus siempre lo ve — no está atado a sucursal, \"sistemas\" no tiene ninguna cargada. Hallazgo real en el camino: el repo tiene DOS mappers de fila de usuario independientes (AuthContext.mapUsuarioRow y usuariosService.mapUsuario) — la regla se agregó primero en los dos por separado y la revisión adversarial marcó la duplicación (LOW), corregido extrayendo la función compartida antes de desplegar. requiere: \"puedeVerOrganigrama\" en navItems.js, único punto de filtrado (navItemsPara) — cubre menú y los 2 buscadores (escritorio y móvil) automáticamente. Confirmado contra pulse-db real con 7 casos simulados (alias legacy, admin_plus sin sucursal). Segundo hallazgo LOW, no bloqueante: la URL directa /organigrama sigue entrando sin el permiso — mismo patrón ya aceptado para módulos sin candado real (esconder el menú no bloquea la URL). 594/594 tests, build y eslint limpios. Desplegado: constants.js en la VPS seguía sin la limpieza de LEGACY_LAUNCH_WEEK de hace semanas (mismo patrón de siempre), corregido de paso. 20/20 visuales, sitio en 200.","refs":"constants.js · AuthContext.jsx · adversarial-reviewer"},
    {"id":"e12","date":"2026-09-09","category":"CORRECCION","title":"El indicador de deslizar estaba tapado por el círculo del checador (bug desde que se creó) + búsqueda a la barra de abajo","desc":"Dos reportes del dueño en uno. 1) \"el indicador de deslizar hacia arriba desaparece\": no era el ocultamiento tras el primer uso, era un bug real de geometría. El círculo del checador (margin-top:-30px) ocupa de -22px a +30px del borde del pill, centrado; el asa estaba en el MISMO centro (-14px a +6px). Los dos son elementos posicionados sin z-index, así que pintaba el último del DOM: el círculo. En los 4 roles con checador el asa fue invisible desde que se creó (e56 de la semana pasada) y del chevron solo asomaba la mitad — por eso nadie encontraba el gesto, que es justo lo que motivó ponerle un indicador. El checker lo reprodujo con Chromium real a 320/360/375/430px midiendo los rectángulos: se solapaban exacto. Arreglo: asa a left:26%, libre en todos los roles y sin robarle el toque a ningún tab. El chevron además queda PERMANENTE — se quitó el localStorage, que era justo lo que molestaba. 2) La búsqueda del teléfono deja de ser el botón redondo flotante de arriba a la izquierda (de ayer, e10) y pasa a ser una fila completa DENTRO de la barra, debajo de los tabs: ahí llega el pulgar y no estorba al círculo, que sobresale hacia arriba. El pill pasó a dos filas y .app-main subió su padding-bottom de 96 a 140px. La barra es un <button>, no un <input>: al tocarla abre una capa con el campo real arriba, porque un input fijo al borde inferior lo tapa el teclado en iOS (fixed se ancla al viewport de layout, no al visual) y la app se usa desde iPhone, Chrome de Android y HuaweiBrowser. Revisión adversarial: APPROVE, 1 hallazgo LOW (un comentario mío sobre touch-action era técnicamente falso — el auto del hijo no puede revivir el paneo bajo un ancestro con none) corregido en el mismo commit. 594/594 tests, build y eslint limpios. Desplegado: 20/20 visuales, sitio en 200.","refs":"Sidebar.jsx · BuscadorMovil.jsx · App.css · adversarial-reviewer"},
    {"id":"e13","date":"2026-09-10","category":"FEATURE","title":"Soporte Mantenimiento: buzón propio para lo que no es de sistemas, y «Soporte TI» pasa a «Soporte Sistemas»","desc":"A pedido del dueño: la gente reportaba lámparas fundidas y fugas al buzón de Soporte TI porque era el único sitio donde reportar algo. Solución: un TERCER canal en Mensajes (migración 155), calcado del de Sistemas (mig. 094) pero atendido por ROL —admin, admin_plus, rh, psicóloga— en vez de por bandera por persona: quienes atienden ya SON esos roles, así que una columna nueva solo sería un interruptor que alguien tiene que acordarse de encender. Cero columnas, cero backfill. Le escribe todo el personal, incluidos los propios admin/rh/psicóloga para lo de su oficina. Lo más delicado fue que la migración REESCRIBE 2 policies vivas de `mensajes` y 1 de storage: los cuerpos se copiaron de producción (pg_get_expr), no del repo, y se verificó después que conservan la rama vieja de 'soporte' además de la nueva — copiar la versión del repo habría borrado reglas vivas sin fallar. Incluye la rama de adjuntos, que la 094 documenta como «la trampa» (un reporte de mantenimiento es casi siempre LA FOTO del desperfecto). El armado de conversaciones salió del componente a un módulo propio con 11 pruebas: es la parte que decide quién ve qué hilo y no tenía ninguna. 3 vueltas de revisión adversarial: SEGURIDAD APPROVE (probó contra producción que admin/rh/psicóloga y los encargados de Sistemas siguen sin poder leer el canal confidencial de la psicóloga, que los dos buzones no se cruzan en SELECT/UPDATE/adjuntos, y que el trigger de tampering solo deja pasar `leido`); CORRECTNESS 1ª vuelta REQUEST_CHANGES con un HIGH real —los 4 roles que atienden Mantenimiento no tenían NINGÚN sitio donde escribir su propio reporte, porque el hilo propio solo aparecía si ya habían escrito: circular— y encima yo había escrito un test que congelaba ese comportamiento; corregido y CORRECTNESS 2ª vuelta (checker fresco) APPROVE, que además rompió el código a propósito con 2 mutaciones para confirmar que las pruebas nuevas fallan cuando el bug vuelve. 605/605 tests, build y eslint limpios. Desplegadas las dos capas (build-api.sh y build-frontend.sh): 20/20 visuales, bundle con «Soporte Mantenimiento» y CERO «Soporte TI», sitio en 200.","refs":"migración 155 · api/enviar-mensaje.js · utils/mensajes/conversaciones.js · plans/plan-soporte-mantenimiento.md · 3× adversarial-reviewer"},
    {"id":"e14","date":"2026-09-10","category":"CORRECCION","title":"Un reporte al buzón de soporte no encendía el aviso de nadie (fallo silencioso, desde la mig. 094)","desc":"Encontrado al montar el buzón de Mantenimiento. El contador de no leídos de BotonMensajes.jsx filtraba por `m.para === yo`, y un mensaje dirigido a un BUZÓN entra sin destinatario (`para` nulo) — así es como se le escribe a un buzón. O sea que desde que existe el canal de Soporte TI (mig. 094), un reporte no encendía el badge de nadie y quien lo mandaba veía «enviado» igual. Encima admin y RH estaban excluidos del contador por un `veChat` que el propio comentario del código admitía como «una decisión sin justificar» — justo los roles que ahora atienden Mantenimiento, con lo que el buzón nuevo habría nacido mudo. Ahora cuenta lo que a esa persona le toca de verdad: lo dirigido a ella más lo que entra a un buzón que atiende. Confirmado contra producción que `canal` nunca es nulo (121 psicologa / 104 soporte) antes de tocar la lógica.","refs":"BotonMensajes.jsx · migración 094"},
    {"id":"e15","date":"2026-09-10","category":"CORRECCION","title":"Los buzones de soporte se veían con iniciales de persona (\"SS\", \"SM\")","desc":"El dueño preguntó si se podían \"poner imágenes\" a los chats de Sistemas y Mantenimiento. Eran dos cosas: mandar FOTOS dentro de esos chats ya funcionaba (el Composer es el mismo en todos los canales y las policies de storage cubren los dos buzones — lo confirmó la revisión de seguridad de ayer), pero los buzones se pintaban con las iniciales de su nombre, como si fueran una persona llamada \"SS\" o \"SM\". Ahora cada uno lleva su ícono (llave inglesa para Sistemas, edificio para Mantenimiento) en la lista, en la cabecera del chat y en el indicador de \"escribiendo\". Avatar.jsx gana un prop opcional `icono` con precedencia foto > ícono > iniciales, así que los otros 27 usos del componente renderizan idéntico. La condición es `para === null`, que sale SOLO del hilo propio hacia un buzón — ninguna persona real puede quedar con ícono ni ningún buzón sin él, verificado por el checker recorriendo los tres sitios que arman conversaciones. APPROVE con 2 hallazgos LOW, los dos atendidos: un ícono no registrado en ICON_MAP dejaría el avatar vacío EN SILENCIO (se deja la advertencia justo donde se agregaría el próximo buzón, porque exportar un helper desde Icon.jsx metía un error nuevo de react-refresh), y el avatar del indicador de \"escribiendo\" no llevaba el ícono. 605/605 tests, 20/20 visuales, sitio en 200.","refs":"Avatar.jsx · Mensajes.jsx · adversarial-reviewer"},
    {"id":"e16","date":"2026-09-10","category":"FEATURE","title":"Horarios por día de verdad, y Nómina semanal con los descuentos de retardos y faltas","desc":"A pedido del dueño, en el orden que él marcó: primero arreglar horarios, luego la nómina. 1) HORARIOS. La base ya guardaba un turno por empleado Y DÍA desde la migración 035, pero la pantalla no dejaba usarlo: editaba un «turno estándar» y solo mostraba campos para un día concreto DESPUÉS de que ese día ya fuera distinto del estándar — o sea que para poner el jueves distinto había que cambiar el estándar, quitar el jueves y volver a marcarlo. Un horario como el del propio dueño (lunes a miércoles 10-14, jueves y viernes 10-19, sábado no viene) era literalmente incapturable. Ahora hay un renglón por cada uno de los 7 días, cada uno con SU entrada, SU salida y SU tolerancia, y un botón por día que dice si trabaja o no —quitarlo es exactamente cómo se dice «este día no viene», y ese día no cuenta como falta (mig. 035)—. El turno estándar se queda arriba pero degradado a lo que siempre fue útil: un atajo para rellenar varios días de golpe. La tolerancia pasó a guardarse al salir del campo y no en cada tecla: antes mandaba un UPDATE por pulsación y la respuesta asíncrona peleaba con quien escribía. 2) NÓMINA (migración 156). Pantalla nueva para admin, RH y psicóloga: por persona, los días L M M J V S con el color de su estado y lo que descuenta cada uno, el sueldo editable en la misma fila y el Pago Final. El domingo solo ocupa columna si alguien trabaja en domingo. Decisiones de dinero tomadas por el dueño y NO por mí: el sueldo se captura SEMANAL, la falta descuenta un monto fijo y no resta además el día, y los dos montos (retardo y falta) son configurables desde la misma pantalla. Lo que NO se construyó, a propósito: ninguna tabla de nóminas calculadas. El recibo se DERIVA cada vez de las checadas + el horario del día + los permisos aprobados, igual que `asistencias` no guarda «faltó» — si estuviera guardado, justificar hoy una falta del mes pasado obligaría a reprocesar filas viejas, y el día que ese reproceso fallara la nómina y la realidad discreparían en silencio. El estado de cada día lo sigue decidiendo construirDias() (utils/asistencia.js), el mismo módulo que pinta el calendario de Asistencia: duplicar esa lógica habría acabado con las dos pantallas diciendo cosas distintas. Detalles que sí importan: el pago final nunca es negativo (si los descuentos se comen el sueldo, es cero, no una deuda), un sueldo sin capturar se muestra como «Falta el sueldo» y no como $0.00 —que parecería un cálculo hecho—, cada persona se clasifica en la zona horaria de SU clínica (Hermosillo va una hora detrás, Reynosa una delante en verano) y un día justificado o de descanso no descuenta nada. El sueldo vive en `usuarios.sueldo_semanal` y no se filtra a la plantilla: lo que lee un empleado es la vista `usuarios_directorio`, que enumera columnas una por una y no la incluye; `nomina_config` está cerrada por RLS a los tres roles de gestión. 617/617 tests (12 nuevos sobre el cálculo del dinero), eslint sin errores nuevos y build limpio.","refs":"migración 156 · utils/nomina.js · components/rh/Nomina.jsx · components/admin/GestionHorarios.jsx"},
    {"id":"e17","date":"2026-09-10","category":"VERIFICACION","title":"e16 desplegado: migración 156 aplicada y frontend reconstruido","desc":"Antes de copiar nada comprobé dos cosas que podían salir caras. 1) `/opt/pulse/app` en la VPS no tiene remotos git y su copia de trabajo está sucia — incluye `src/components/admin/GestionHorarios.jsx`, justo uno de los archivos que iba a sobrescribir. Saqué el md5 de los 7 archivos modificados en la VPS y los comparé contra los mismos blobs en el commit base 5b4a69f: los 7 coinciden byte a byte. O sea que esas marcas de \"modificado\" son relativas a la historia propia de la VPS, no cambios vivos que yo fuera a pisar — no se perdió nada. 2) El disco de la VPS solo tiene migraciones hasta la 150, pero consulté la base y los objetos de la 153 (`areas`) y la 155 (`es_mantenimiento()`) SÍ están aplicados: el retraso es del sistema de archivos, no del esquema, así que la 156 no se apoyaba en nada ausente. Verifiqué además en la base viva —no en el comentario de mi propia migración— que existen `current_role()` y `current_usuario_id()`, que `usuarios_directorio` enumera 9 columnas explícitas y que están las 5 policies de `usuarios`, incluida `usuarios_update_own`, la que el revisor de seguridad persiguió hasta confirmar que el trigger anti-escalación la neutraliza para el sueldo. Copia con tar sobre ssh de los 12 archivos, con los 12 md5 confirmados iguales de los dos lados. Migración aplicada con ON_ERROR_STOP: COMMIT, exit 0. Estado posterior comprobado: `nomina_config` con su única fila (montos en 0), `sueldo_semanal` nullable con su check, RLS activo, las dos policies select/update, el directorio SIGUE con las mismas 9 columnas sin sueldo, y 0 de 119 sueldos capturados (falta el archivo del dueño). Frontend reconstruido con infra/scripts/build-frontend.sh (que aborta solo si el bundle no apunta a la URL pública y deja tag `previa` para volver atrás). Sitio en 200, /rest/v1/ en 401, contenedor arriba, y las cuatro cadenas nuevas presentes en el bundle servido: «Nómina», «Falta el sueldo», «nomina_config» y «No trabaja este día» — o sea que lo que se sirve es el código nuevo, no una imagen cacheada. PENDIENTE AJENO A ESTE CAMBIO: los .sql de las migraciones 151-155 siguen sin existir en el disco de la VPS aunque su esquema esté aplicado; conviene sincronizarlos para que el disco no mienta sobre el estado real.","refs":"VPS /opt/pulse/app · migración 156 · infra/scripts/build-frontend.sh"},
    {"id":"e18","date":"2026-09-10","category":"CORRECCION","title":"Producción iba por DELANTE del repo: rescatado de la VPS un arreglo vivo que no existía en git","desc":"Salió de tirar del hilo que dejó el despliegue de la nómina (e17). Al desplegar comparé los archivos que iba a sobrescribir y coincidían, pero quedaban ~100 archivos marcados como modificados en la VPS que no había mirado. El dueño dijo, con lógica, que da igual porque «lo que subimos de local es lo que corre». Lo comprobé en vez de discutirlo: de los 103, 97 son idénticos al HEAD local y 6 difieren. De esos 6, tres son rezago inofensivo (su contenido SÍ está en el historial local, o sea que local ya los superó) y tres no. El método para distinguirlos fue calcular el blob git del archivo de la VPS y preguntar si ese objeto existe en el repo local: si existe, es una versión vieja; si no, es contenido que no está en ninguna parte más. DOS RESULTAN SER TRABAJO REAL QUE SOLO EXISTÍA EN EL SERVIDOR: `api/tareas-programadas.js` (mtime 2026-09-01) con la función `semanasDelPeriodo`, y `api/periodo.frontVsApi.test.js` (mtime 2026-08-17), que nunca había existido en el repo. Confirmado que NO era código muerto en disco: el contenedor `pulse-api-server` corre una imagen construida hoy y `grep` DENTRO de esa imagen encuentra `semanasDelPeriodo`, o sea que el arreglo está vivo en producción. Y `git log --all -S \"semanasDelPeriodo\"` en local no devuelve nada. Lo que se habría roto: el recordatorio de encuesta filtra por «quien no tenga encuesta de ESTE período»; si el servidor y el front no coinciden en qué es eso, las ~95 personas reciben avisos martes, jueves y viernes por una encuesta ya entregada. El comentario del propio archivo dice que eso ya ocurrió al revés en agosto. Bastaba con que alguien copiara ese archivo desde local y corriera build-api.sh —el mismo gesto que yo acababa de hacer con el frontend— para revertirlo sin que nadie se enterara. Rescatados los dos a git, byte a byte (md5 confirmado de los dos lados), con 620/620 tests: los 3 del test rescatado pasan contra el constants.js local, lo que además demuestra que hoy front y servidor SÍ coinciden. El tercer archivo divergente, `src/components/inventario/App.css` (354 KB), es una copia suelta de la hoja de estilos que no existe en local y que nadie importa: basura, se ignora. TAMBIÉN CORREGÍ UN ERROR MÍO: en el primer conteo reporté «0 ausentes en local», y era falso — la comprobación capturaba el código de salida de `md5sum` en vez del de `git show`, así que los archivos inexistentes en local se colaban como «distintos». Eran dos, no cero. El lado de los 97 idénticos sí era correcto.","refs":"api/tareas-programadas.js · api/periodo.frontVsApi.test.js · VPS pulse-api-server"}

<script>
(function(){
  var STORAGE_KEY = 'mcdental-bitacora-pulse-v1';

  var CATS = [
    ['BACKEND','Backend','#8b9dff'],
    ['UI','UI','#d19bff'],
    ['DATOS','Datos','#f2c14e'],
    ['CORRECCION','Corrección','#ff8080'],
    ['FEATURE','Feature','#3ddc9b'],
    ['HALLAZGO','Hallazgo','#5cc8f2'],
    ['VERIFICACION','Verificación','#3fe0c5'],
    ['OTRO','Otro','#9fb0a9']
  ];
  function catMeta(key){
    for(var i=0;i<CATS.length;i++){ if(CATS[i][0]===key) return {label:CATS[i][1],color:CATS[i][2]}; }
    return {label:'Otro',color:'#9fb0a9'};
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return JSON.parse(document.getElementById('seed').textContent);
  }
  var STATE = loadState();

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function editBtn(action,id,label){
    return '<button class="icon-edit no-print" data-action="'+action+'"'+(id?' data-id="'+id+'"':'')+
      ' aria-label="'+esc(label)+'"><svg class="icon icon-sm"><use href="#icon-pencil"/></svg></button>';
  }
  function delBtn(action,id,label){
    return '<button class="chip-x no-print" data-action="'+action+'" data-id="'+id+'" aria-label="'+esc(label)+'">'+
      '<svg class="icon icon-sm"><use href="#icon-x"/></svg></button>';
  }
  function pad(n){ return String(n).padStart(2,'0'); }
  function todayISO(){
    var d=new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function dateRange(startISO,endISO){
    var out=[], d=new Date(startISO+'T00:00:00'), end=new Date(endISO+'T00:00:00');
    while(d<=end){
      out.push(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));
      d.setDate(d.getDate()+1);
    }
    return out;
  }
  function formatRange(startISO,endISO){
    var s=new Date(startISO+'T00:00:00'), e=new Date(endISO+'T00:00:00');
    var wd=function(d){return new Intl.DateTimeFormat('es-MX',{weekday:'short'}).format(d).replace('.','');};
    var my=function(d){return new Intl.DateTimeFormat('es-MX',{month:'short',year:'numeric'}).format(d).replace('.','');};
    return wd(s)+' '+s.getDate()+' — '+wd(e)+' '+e.getDate()+' '+my(e);
  }
  function formatDayHeader(iso){
    var d=new Date(iso+'T00:00:00');
    var weekday=new Intl.DateTimeFormat('es-MX',{weekday:'long'}).format(d);
    var month=new Intl.DateTimeFormat('es-MX',{month:'long'}).format(d);
    return {weekday: weekday.charAt(0).toUpperCase()+weekday.slice(1), rest: d.getDate()+' de '+month};
  }
  function autoUpdated(){
    var d=new Date();
    var wd=new Intl.DateTimeFormat('es-MX',{weekday:'short'}).format(d).replace('.','');
    var mon=new Intl.DateTimeFormat('es-MX',{month:'short'}).format(d).replace('.','');
    return wd+' '+d.getDate()+' '+mon+', '+pad(d.getHours())+':'+pad(d.getMinutes());
  }

  function entryTpl(e){
    var cm = catMeta(e.category);
    return '<div class="entry">'+
      '<div class="entry-head">'+
        '<span class="entry-title">'+esc(e.title)+'</span>'+
        '<span class="cat" style="color:'+cm.color+';background:'+cm.color+'22">'+esc(cm.label)+'</span>'+
        '<span class="entry-tools no-print">'+
          editBtn('edit-entry',e.id,'Editar entrada: '+e.title)+
          delBtn('del-entry',e.id,'Eliminar entrada: '+e.title)+
        '</span>'+
      '</div>'+
      '<p class="entry-desc">'+esc(e.desc)+'</p>'+
      (e.refs ? '<div class="refs">'+esc(e.refs)+'</div>' : '')+
    '</div>';
  }

  function dayTpl(iso){
    var h = formatDayHeader(iso);
    var isToday = iso===todayISO();
    var entries = STATE.entries.filter(function(e){return e.date===iso;});
    var tag = STATE.dayTags[iso];
    var tagHtml = '<span class="day-tools">'+
      (tag
        ? '<span class="day-tag">'+esc(tag)+'</span>'+editBtn('edit-daytag',iso,'Editar etiqueta del día')
        : '<button class="day-tag no-print" data-action="edit-daytag" data-id="'+iso+'" style="opacity:.5">+ etiqueta</button>')+
    '</span>';
    var body;
    if(entries.length){
      body = entries.map(entryTpl).join('');
    } else if(iso===STATE.weekEnd){
      body = '<p class="empty-note">Día de entrega del reporte semanal — se cierra esta bitácora aquí.</p>';
    } else {
      body = '<p class="empty-note">Todavía no hay trabajo registrado — se actualiza al final del día.</p>';
    }
    return '<div class="day">'+
      '<div class="day-head">'+
        '<span class="day-weekday">'+esc(h.weekday)+'</span>'+
        '<span class="day-rest">'+esc(h.rest)+(isToday?' · hoy':'')+'</span>'+
        tagHtml+
      '</div>'+
      body+
    '</div>';
  }

  function statTpl(s){
    return '<div class="stat">'+
      '<div class="value">'+esc(s.value)+'</div><div class="label">'+esc(s.label)+'</div>'+
      '<span class="stat-tools no-print">'+
        editBtn('edit-stat',s.id,'Editar métrica: '+s.label)+
        delBtn('del-stat',s.id,'Quitar métrica: '+s.label)+
      '</span>'+
    '</div>';
  }

  function pendingTpl(p){
    return '<li><span class="arrow"><svg class="icon icon-sm"><use href="#icon-arrow-right"/></svg></span>'+
      '<span class="ptext">'+esc(p.text)+'</span>'+
      '<span class="owner">'+esc(p.owner)+'</span>'+
      editBtn('edit-pending',p.id,'Editar pendiente: '+p.text)+
      delBtn('del-pending',p.id,'Quitar pendiente: '+p.text)+
    '</li>';
  }

  function buildBody(){
    var days = dateRange(STATE.weekStart, STATE.weekEnd).map(dayTpl).join('');
    var stats = STATE.stats.map(statTpl).join('') +
      '<button class="add-stat no-print" data-action="add-stat">+ métrica</button>';
    var pendings = STATE.pendings.length ? STATE.pendings.map(pendingTpl).join('')
      : '<li class="empty-note pendings-empty">Sin pendientes por ahora.</li>';
    return (
      '<p class="eyebrow">McDental Pulse · Bitácora de trabajo</p>'+
      '<h1>'+esc(STATE.title)+editBtn('edit-title',null,'Editar título')+'</h1>'+
      '<p class="sub">'+esc(STATE.subtitle)+editBtn('edit-subtitle',null,'Editar subtítulo')+'</p>'+
      '<div class="meta">'+
        '<span><b>Rango</b>'+esc(formatRange(STATE.weekStart,STATE.weekEnd))+editBtn('edit-range',null,'Editar rango de fechas')+'</span>'+
        '<span><b>Entorno</b>'+esc(STATE.entorno)+editBtn('edit-entorno',null,'Editar entorno')+'</span>'+
      '</div>'+
      '<p class="updated">Última actualización '+esc(STATE.lastUpdate)+'</p>'+
      '<div class="actions no-print">'+
        '<button data-action="print"><svg class="icon"><use href="#icon-printer"/></svg> Descargar / imprimir PDF</button>'+
        '<button class="primary" data-action="add-entry">+ Agregar entrada</button>'+
        '<button data-action="new-week"><svg class="icon"><use href="#icon-refresh"/></svg> Nueva semana</button>'+
      '</div>'+
      '<div class="stats">'+stats+'</div>'+
      '<div class="timeline">'+days+'</div>'+
      '<div class="pendings">'+
        '<h2>Lo que sigue, para que no se pierda</h2>'+
        '<p>No es trabajo pendiente de esta semana — son decisiones que le tocan al dueño.</p>'+
        '<ul>'+pendings+'</ul>'+
        '<button class="no-print" data-action="add-pending">+ pendiente</button>'+
      '</div>'+
      '<footer><span>McDental Pulse — bitácora interna, no compartir fuera del equipo</span><span>mcdentalpulse.duckdns.org</span></footer>'
    );
  }

  function showBanner(msg){
    var b=document.getElementById('banner');
    b.textContent=msg; b.hidden=false;
  }

  function render(){
    document.getElementById('app').innerHTML = buildBody();
  }

  function persist(){
    STATE.lastUpdate = autoUpdated();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
    catch(e){ showBanner('No se pudo guardar en este navegador: '+e.message); }
    render();
  }

  // ---- entry dialog ----
  var dialog = document.getElementById('entryDialog');
  var form = document.getElementById('entryForm');
  var catSelect = document.getElementById('f-cat');
  catSelect.innerHTML = CATS.map(function(c){return '<option value="'+c[0]+'">'+c[1]+'</option>';}).join('');

  function clampDate(iso){
    if(iso<STATE.weekStart) return STATE.weekStart;
    if(iso>STATE.weekEnd) return STATE.weekEnd;
    return iso;
  }
  function openEntryDialog(entry){
    document.getElementById('entryDialogTitle').textContent = entry ? 'Editar entrada' : 'Agregar entrada';
    document.getElementById('f-id').value = entry ? entry.id : '';
    document.getElementById('f-date').value = entry ? entry.date : clampDate(todayISO());
    catSelect.value = entry ? entry.category : 'BACKEND';
    document.getElementById('f-title').value = entry ? entry.title : '';
    document.getElementById('f-desc').value = entry ? entry.desc : '';
    document.getElementById('f-refs').value = entry ? (entry.refs||'') : '';
    dialog.showModal();
  }
  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var id = document.getElementById('f-id').value;
    var data = {
      date: document.getElementById('f-date').value,
      category: catSelect.value,
      title: document.getElementById('f-title').value.trim(),
      desc: document.getElementById('f-desc').value.trim(),
      refs: document.getElementById('f-refs').value.trim()
    };
    if(!data.title || !data.desc || !data.date) return;
    if(id){
      var e = STATE.entries.find(function(x){return x.id===id;});
      if(e) Object.assign(e, data);
    } else {
      data.id = uid();
      STATE.entries.push(data);
    }
    dialog.close();
    persist();
  });
  dialog.addEventListener('click', function(ev){ if(ev.target===dialog) dialog.close(); });

  // ---- range dialog ----
  var rangeDialog = document.getElementById('rangeDialog');
  document.getElementById('rangeForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    var s = document.getElementById('r-start').value;
    var e = document.getElementById('r-end').value;
    if(!s || !e || s>e){ alert('Fechas inválidas: el inicio debe ser antes que el fin.'); return; }
    STATE.weekStart = s; STATE.weekEnd = e;
    rangeDialog.close();
    persist();
  });
  rangeDialog.addEventListener('click', function(ev){ if(ev.target===rangeDialog) rangeDialog.close(); });

  // ---- entorno dialog ----
  var entornoDialog = document.getElementById('entornoDialog');
  document.getElementById('entornoForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    var v = document.getElementById('ent-value').value.trim();
    if(!v) return;
    STATE.entorno = v;
    entornoDialog.close();
    persist();
  });
  entornoDialog.addEventListener('click', function(ev){ if(ev.target===entornoDialog) entornoDialog.close(); });

  // ---- generic text dialog (título, subtítulo, etiqueta, métricas, pendientes, nueva semana) ----
  var textDialog = document.getElementById('textDialog');
  var textDialogTitle = document.getElementById('textDialogTitle');
  var TEXT_FIELDS = [1,2,3].map(function(n){
    return {
      wrap: document.getElementById('tf-wrap-'+n),
      label: document.getElementById('tf-label-'+n),
      input: document.getElementById('tf-'+n)
    };
  });
  var textDialogOnSave = null;
  function openTextDialog(title, fields, onSave){
    textDialogTitle.textContent = title;
    TEXT_FIELDS.forEach(function(slot, i){
      var f = fields[i];
      if(f){
        slot.wrap.hidden = false;
        slot.label.textContent = f.label;
        slot.input.type = f.type || 'text';
        slot.input.value = f.value || '';
        slot.input.placeholder = f.placeholder || '';
        slot.input.required = f.required !== false;
      } else {
        slot.wrap.hidden = true;
        slot.input.required = false;
      }
    });
    textDialogOnSave = onSave;
    textDialog.showModal();
  }
  document.getElementById('textDialogForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    var values = TEXT_FIELDS.map(function(slot){ return slot.input.value.trim(); });
    if(textDialogOnSave) textDialogOnSave(values);
  });
  textDialog.addEventListener('click', function(ev){ if(ev.target===textDialog) textDialog.close(); });

  // ---- delegated actions ----
  document.addEventListener('click', function(ev){
    var el = ev.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action, id = el.dataset.id;
    switch(action){
      case 'print': window.print(); break;
      case 'close-dialog': {
        var openDialog = document.querySelector('dialog[open]');
        if(openDialog) openDialog.close();
        break;
      }
      case 'add-entry': openEntryDialog(null); break;
      case 'edit-entry': openEntryDialog(STATE.entries.find(function(x){return x.id===id;})); break;
      case 'del-entry':
        if(confirm('¿Eliminar esta entrada?')){
          STATE.entries = STATE.entries.filter(function(x){return x.id!==id;});
          persist();
        }
        break;
      case 'edit-title': {
        openTextDialog('Editar título', [{label:'Título', value:STATE.title}], function(v){
          if(!v[0]) return;
          STATE.title = v[0]; textDialog.close(); persist();
        });
        break;
      }
      case 'edit-subtitle': {
        openTextDialog('Editar subtítulo', [{label:'Subtítulo', value:STATE.subtitle, required:false}], function(v){
          STATE.subtitle = v[0]; textDialog.close(); persist();
        });
        break;
      }
      case 'edit-range': {
        document.getElementById('r-start').value = STATE.weekStart;
        document.getElementById('r-end').value = STATE.weekEnd;
        rangeDialog.showModal();
        break;
      }
      case 'edit-entorno': {
        document.getElementById('ent-value').value = STATE.entorno;
        entornoDialog.showModal();
        break;
      }
      case 'edit-daytag': {
        openTextDialog('Etiqueta del día', [{label:'Etiqueta (vacío para quitarla)', value:STATE.dayTags[id]||'', required:false}], function(v){
          if(v[0]) STATE.dayTags[id]=v[0]; else delete STATE.dayTags[id];
          textDialog.close(); persist();
        });
        break;
      }
      case 'add-stat': {
        openTextDialog('Agregar métrica', [
          {label:'Valor (ej. 4, 33/33)', value:''},
          {label:'Etiqueta (ej. bugs corregidos)', value:''}
        ], function(v){
          if(!v[0]||!v[1]) return;
          STATE.stats.push({id:uid(), value:v[0], label:v[1]});
          textDialog.close(); persist();
        });
        break;
      }
      case 'edit-stat': {
        var s2 = STATE.stats.find(function(x){return x.id===id;}); if(!s2) break;
        openTextDialog('Editar métrica', [
          {label:'Valor', value:s2.value},
          {label:'Etiqueta', value:s2.label}
        ], function(v){
          if(!v[0]||!v[1]) return;
          s2.value=v[0]; s2.label=v[1]; textDialog.close(); persist();
        });
        break;
      }
      case 'del-stat':
        STATE.stats = STATE.stats.filter(function(x){return x.id!==id;});
        persist();
        break;
      case 'add-pending': {
        openTextDialog('Agregar pendiente', [
          {label:'Pendiente', value:''},
          {label:'¿De quién depende?', value:'dueño'}
        ], function(v){
          if(!v[0]) return;
          STATE.pendings.push({id:uid(), text:v[0], owner:v[1]||'dueño'});
          textDialog.close(); persist();
        });
        break;
      }
      case 'edit-pending': {
        var p = STATE.pendings.find(function(x){return x.id===id;}); if(!p) break;
        openTextDialog('Editar pendiente', [
          {label:'Pendiente', value:p.text},
          {label:'¿De quién depende?', value:p.owner}
        ], function(v){
          if(!v[0]) return;
          p.text=v[0]; p.owner=v[1]||p.owner; textDialog.close(); persist();
        });
        break;
      }
      case 'del-pending':
        STATE.pendings = STATE.pendings.filter(function(x){return x.id!==id;});
        persist();
        break;
      case 'new-week': {
        if(!confirm('¿Empezar una semana nueva? Exportá el PDF de esta semana antes si no lo hiciste.')) break;
        openTextDialog('Nueva semana', [
          {label:'Fecha de inicio', type:'date', value:STATE.weekEnd},
          {label:'Fecha de fin', type:'date', value:STATE.weekEnd},
          {label:'Título', value:STATE.title}
        ], function(v){
          if(!v[0] || !v[1] || v[0]>v[1] || !v[2]){ alert('Revisá las fechas y el título.'); return; }
          STATE = {
            title: v[2], subtitle: STATE.subtitle, weekStart: v[0], weekEnd: v[1],
            entorno: STATE.entorno, lastUpdate: '', stats: [], dayTags: {},
            entries: [], pendings: STATE.pendings
          };
          textDialog.close(); persist();
        });
        break;
      }
    }
  });

  render();
})();
</script>
</body>
</html>
